<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;D Planner — Novella Modi'in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html{overflow-y:scroll} /* always reserve the scrollbar so views of different height don't shift sideways */
body{margin:0;background:#F4F4F1}
button{font-family:inherit}
.blk{margin:2px;padding:5px 7px;border-radius:6px;display:flex;align-items:flex-start;gap:7px;min-width:0;box-sizing:border-box;color:#FFFFFF;font-size:11.5px;font-weight:500;line-height:1.3;position:relative;z-index:1}
.blk .tx{min-width:0;overflow-wrap:anywhere;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk.prop{outline:2px dashed rgba(255,255,255,.85);outline-offset:-4px}
.cell:hover{background:rgba(43,108,176,.06)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #FFFFFF;box-sizing:border-box;color:#FFFFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= DATA — edit here ================= */
const START = '2026-10-25';   // first Sunday shown
const END = '2027-03-31';     // last day shown (calendar + timeline)
const NWEEKS = Math.floor((Date.parse(END) - Date.parse(START)) / (7 * 864e5)) + 1;

const THEMES = [
  [1, '1 · Keep the line alive'],
  [2, '2 · Make it work at home'],
  [3, '3 · Support strawberry product (production & marketing)'],
  [4, '4 · Innovate & improve'],
  [5, 'Team & routine']
];
// pri: 1 = top priority now, 2 = high, 3 = normal, 4 = parked / later. Proposed 8 Nov from the Shimrit 1:1 — refine.
const PRI = { 1: ['P1', 'Top', '#9B1C1C', '#FDE3E3'], 2: ['P2', 'High', '#8C5A00', '#FCEFD6'], 3: ['P3', 'Normal', '#3F444A', '#EEEEEA'], 4: ['P4', 'Parked', '#6B7075', '#F4F4F1'] };
let P = {};   // projects — loaded from the Sheet
const PEOPLE = {
  yoni:  { name: 'Yoni',  c: '#2B6CB0', routine: 0, cap: 5 },
  nadav: { name: 'Nadav', c: '#B7410E', routine: 1, cap: 5, routineText: 'daily sampling & checks' },
  dorin: { name: 'Dorin', c: '#2F855A', routine: 1, cap: 5, routineText: 'media prep, housekeeping' },
  or:    { name: 'Or',    c: '#6B46C1', routine: 0, cap: null },
  tech:  { name: 'Technician', c: '#4A5568', routine: 0, cap: 5, hidden: 1 } // retired 12 Nov; kept so old items still render
};

// Plan data lives in the Google Sheet (see SYNC below) and is loaded on start.
// Shapes: B = calendar blocks {id,lane,date,h,len,p,t,prop,run,tt,st,note}
//         PB = platform bars, Q = [p,name,need,now,wt,id], TL = {project:[{id,kind,name,s,e,prop,note}]}
//         OV = project cards, VR = vessel runs
const b = (lane, date, h, len, p, t, o) => Object.assign({ lane, date, h, len, p, t }, o || {});
let B = [], PB = [], Q = [], TL = {}, OV = {};

// ---- Bioreactor vessels (Platforms view + vessel filter) ----
// v = vessel, or 'TBC' until assigned. fam = which kind it needs (shown while TBC).
// Calendar blocks link to a run with {run:'id'}, so assigning a vessel here updates everything.
const VESSELS = ['MF1', 'MF2', 'MF3', 'V1', 'V2', 'V3', 'V4']; // V1–V4 = Dasgip stations; DG5, DG6… are run IDs
// hold: 1 = vessel blocked but not running cells (e.g. autoclave validation). Drawn hatched; not counted as utilization.
let VR = [];

/* ================= ENGINE ================= */
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = [];
(function () {
  const d0 = new Date(START + 'T12:00:00');
  for (let w = 0; w < NWEEKS; w++) for (let i = 0; i < 5; i++) {
    const d = new Date(d0); d.setDate(d0.getDate() + w * 7 + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    DAYS.push({ iso, day: DAYN[i], date: d.getDate() + ' ' + MON[d.getMonth()] });
  }
})();
const IDX = {}; DAYS.forEach((d, i) => IDX[d.iso] = i);
const todayIso = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
const TODAY = IDX[todayIso] ?? -1;

let state = {};
try { const v0 = localStorage.getItem('novella_planner_view'); if (v0) state.view = v0; } catch (e) {}
const H = [];
function setState(p) { state = Object.assign({}, state, p); if (p.view) { try { localStorage.setItem('novella_planner_view', p.view); } catch (e) {} } render(); }
function on(fn) { H.push(fn); return 'H[' + (H.length - 1) + ']()'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
const priBadge = (k, big) => { const q = PRI[P[k].pri || 3]; return '<span title="Priority: ' + q[1] + '" style="flex:none;font-family:\'IBM Plex Mono\',monospace;font-size:' + (big ? 11 : 10) + 'px;font-weight:600;padding:1px 6px;border-radius:4px;background:' + q[3] + ';color:' + q[2] + ';white-space:nowrap">' + q[0] + '</span>'; };
const byPri = (a, b2) => (P[a].pri || 3) - (P[b2].pri || 3);
const TITLE_MAX = 22;
const ttl = (x) => x.title || (x.t && x.t.length > TITLE_MAX ? x.t.slice(0, TITLE_MAX - 1).trim() + '…' : (x.t || ''));
const fmt = (x) => (Math.round(x * 2) / 2).toString();
const slot = (it) => (IDX[it.date] ?? -999) * 2 + it.h;

function pack(list) {
  const rows = [];
  list.forEach((it) => {
    let r = 0;
    while (rows[r] && rows[r].some((o) => it.a < o.z && o.a < it.a + it.len)) r++;
    (rows[r] = rows[r] || []).push({ a: it.a, z: it.a + it.len });
    it.row = r;
  });
  return rows.length;
}


const CURW = Math.max(0, Math.floor((Date.parse(todayIso + 'T12:00:00') - Date.parse(START + 'T12:00:00')) / (7 * 864e5)));

const vesOf = (id) => { const r = VR.find((x) => x.id === id); return r ? r.v : null; };
function ganttAxis(LBL) {
  const t0 = Date.parse(START + 'T00:00:00'), t1 = Date.parse(END + 'T00:00:00') + 864e5, span = t1 - t0;
  const pct = (iso, endOfDay) => ((Date.parse(iso + 'T00:00:00') + (endOfDay ? 864e5 : 0) - t0) / span * 100);
  let h = '<div style="display:grid;grid-template-columns:' + LBL + 'px 1fr;align-items:end"><div></div><div style="position:relative;height:26px;border-bottom:1px solid #E1E2DC">';
  const d = new Date(START + 'T12:00:00'); d.setDate(1); let first = true;
  while (d.getTime() < t1) {
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
    const nx = new Date(d); nx.setMonth(nx.getMonth() + 1);
    const visDays = (Math.min(nx.getTime(), t1) - Math.max(d.getTime(), t0)) / 864e5;
    const lbl = visDays < 12 ? '' : MON[d.getMonth()] + (d.getMonth() === 0 || first ? ' ' + d.getFullYear() : '');
    if (lbl) first = false;
    h += '<div style="position:absolute;left:' + Math.max(0, pct(iso)) + '%;top:0;bottom:0;border-left:1px solid #D5D6D0;padding-left:6px;font-weight:700;font-size:12.5px;white-space:nowrap">' + lbl + '</div>';
    d.setMonth(d.getMonth() + 1);
  }
  h += '</div></div>';
  const tp = (todayIso >= START && todayIso <= END) ? pct(todayIso) + (100 / (span / 864e5)) / 2 : null;
  return { h, pct, tp, dayW: 100 / (span / 864e5) };
}

function renderOverview(sel) {
  const keys = Object.keys(P).filter((k) => !sel || k === sel);
  const mono = 'font-family:\'IBM Plex Mono\',monospace;';
  let h = '';
  THEMES.forEach(([n, label]) => {
    const ks = keys.filter((k) => P[k].theme === n).sort(byPri);
    if (!ks.length) return;
    h += '<div style="' + mono + 'font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5F6368;margin:6px 0 -6px">' + esc(label) + '</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">';
    ks.forEach((k) => {
      const o = OV[k] || {}, c = P[k].c;
      h += '<article style="background:#FFFFFF;border:1px solid #E1E2DC;border-top:4px solid ' + c + ';border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0">';
      h += '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="display:flex;gap:8px;align-items:center;min-width:0">' + priBadge(k, 1) + '<div style="font-weight:700;font-size:14.5px;line-height:1.3">' + esc(P[k].name) + '</div></div>';
      h += '<span style="' + mono + 'font-size:10.5px;padding:2px 7px;border-radius:4px;background:' + c + '14;color:' + c + '">' + esc(o.status || '') + '</span></div>';
      h += '<div style="font-size:11.5px;color:#4A4F55;display:flex;flex-wrap:wrap;gap:4px 12px"><span><b style="color:#1B1D1F">Owner</b> ' + esc(o.owner || '—') + '</span><span><b style="color:#1B1D1F">With</b> ' + esc(o.who || '—') + '</span><span><b style="color:#1B1D1F">Horizon</b> ' + esc(o.horizon || '—') + '</span></div>';
      if (o.goals) h += '<div><div style="' + mono + 'font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#6B7075;margin-bottom:3px">Objectives</div><ul style="margin:0;padding-left:18px;line-height:1.45;font-size:12.5px">' + o.goals.map((g) => '<li>' + esc(g) + '</li>').join('') + '</ul></div>';
      if (o.plan) {
        h += '<div><div style="' + mono + 'font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#6B7075;margin-bottom:3px">Plan</div>';
        o.plan.forEach(([s, d]) => { h += '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:3px 0;border-top:1px solid #F0F0EC;font-size:12.5px;line-height:1.4"><span>' + esc(s) + '</span><span style="' + mono + 'font-size:11px;color:#5F6368;text-align:right;max-width:120px">' + esc(d) + '</span></div>'; });
        h += '</div>';
      }
      h += '<div style="margin-top:auto;display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:6px;border-top:1px solid #E1E2DC"><span style="font-size:12px"><b>Next:</b> ' + esc(o.next || '—') + '</span>';
      h += '<span style="flex:none;display:flex;gap:6px">' + (isAdmin() && SYNC.who ? '<button onclick="' + on(() => editCard(k)) + '" style="border:1px solid #C9CBC4;background:#FFFFFF;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11.5px">Edit</button>' : '') + '<button onclick="' + on(() => setState({ sel: k, view: 'tl' })) + '" style="border:1px solid #C9CBC4;background:#FFFFFF;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11.5px">Timeline →</button></span></div>';
      h += '</article>';
    });
    h += '</div>';
  });
  h += '<div style="font-size:11.5px;color:#6B7075">Durations are rough estimates (weeks/months). Day-to-day work lives in Calendar.</div>';
  return h;
}

function renderPlatforms(sel) {
  const LBL = 170, ax = ganttAxis(LBL), mono = 'font-family:\'IBM Plex Mono\',monospace;';
  let h = '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;overflow-x:auto"><div style="min-width:1000px;padding:10px 12px 14px">' + ax.h;
  const lanes = VESSELS.concat(VR.some((r) => r.v === 'TBC') ? ['TBC'] : []);
  lanes.forEach((v, i) => {
    const runs = VR.filter((r) => r.v === v), tbc = v === 'TBC';
    if (i === 3 || tbc) h += '<div style="height:8px"></div>';
    h += '<div style="display:grid;grid-template-columns:' + LBL + 'px 1fr;align-items:center;min-height:34px;border-top:1px solid #EEEEEA">';
    h += '<div style="padding:4px 10px 4px 4px;font-weight:700;font-size:13px' + (tbc ? ';color:#9B1C1C' : '') + '">' + (tbc ? 'Vessel not assigned' : esc(v)) + '</div><div style="position:relative;height:100%;min-height:34px">';
    if (ax.tp !== null) h += '<div style="position:absolute;left:' + ax.tp + '%;top:0;bottom:0;border-left:2px solid #E0A526"></div>';
    runs.forEach((r) => {
      const c = P[r.p].c, l = ax.pct(r.s), w = Math.max(ax.pct(r.e, 1) - l, 0.6), dim = sel && r.p !== sel;
      const lab = (r.hold ? 'Held: ' : '') + r.t + (tbc ? ' · needs ' + r.fam : '');
      h += '<div title="' + esc(lab + ' — ' + r.s + ' → ' + r.e + (r.prop ? ' (proposed)' : '')) + '" style="position:absolute;left:' + l + '%;width:' + w + '%;top:5px;bottom:5px;border-radius:5px;background:' + (r.hold ? 'repeating-linear-gradient(135deg,' + c + '33 0 6px,#FFFFFF 6px 12px);border:2px solid ' + c : c) + ';opacity:' + (dim ? .2 : 1) + ';color:' + (r.hold ? '#1B1D1F' : '#FFFFFF') + ';font-size:10.5px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;' + (r.prop ? 'outline:2px dashed rgba(255,255,255,.85);outline-offset:-4px;' : '') + '">' + esc(lab) + '</div>';
    });
    h += '</div></div>';
  });
  h += '</div></section>';

  const months = []; { const d = new Date(START + 'T12:00:00'); d.setDate(1); while (d.getTime() <= Date.parse(END)) { months.push([d.getFullYear(), d.getMonth()]); d.setMonth(d.getMonth() + 1); } }
  const used = (v, y, m) => {
    const z = new Date(y, m + 1, 0, 12); let tot = 0, conf = 0, prop = 0, held = 0;
    for (const d = new Date(y, m, 1, 12); d <= z; d.setDate(d.getDate() + 1)) {
      const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (iso < START || iso > END) continue; tot++;
      const all = VR.filter((r) => r.v === v && r.s <= iso && iso <= r.e), hit = all.filter((r) => !r.hold);
      if (hit.some((r) => !r.prop)) conf++; else if (hit.length) prop++; else if (all.length) held++;
    }
    return { tot, conf, prop, held };
  };
  h += '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;padding:14px 16px;overflow-x:auto"><h2 style="margin:0 0 4px;font-size:16px">Utilization by month</h2><p style="margin:0 0 10px;font-size:12px;color:#5F6368">Share of calendar days each vessel is booked: confirmed, then +proposed in grey.</p>';
  h += '<table style="border-collapse:collapse;font-size:12.5px;min-width:560px"><tr><th style="text-align:left;padding:4px 10px 4px 0">Vessel</th>' + months.map(([y, m]) => '<th style="text-align:right;padding:4px 10px;' + mono + 'font-weight:500">' + MON[m] + '</th>').join('') + '</tr>';
  let tCap = 0, tConf = 0, tProp = 0, tHeld = 0;
  VESSELS.forEach((v) => {
    h += '<tr style="border-top:1px solid #EEEEEA"><td style="padding:5px 10px 5px 0;font-weight:700">' + v + '</td>';
    months.forEach(([y, m]) => {
      const u = used(v, y, m); tCap += u.tot; tConf += u.conf; tProp += u.prop; tHeld += u.held;
      const pc = u.tot ? Math.round(u.conf / u.tot * 100) : 0, pp = u.tot ? Math.round(u.prop / u.tot * 100) : 0;
      h += '<td style="text-align:right;padding:5px 10px;' + mono + (pc ? 'font-weight:600' : 'color:#9AA0A6') + '">' + pc + '%' + (pp ? '<span style="color:#9AA0A6;font-weight:400"> +' + pp + '</span>' : '') + (u.held ? '<span style="color:#8A5A00;font-weight:400" title="held, not running"> h' + Math.round(u.held / u.tot * 100) + '</span>' : '') + '</td>';
    });
    h += '</tr>';
  });
  h += '</table>';
  const nT = VR.filter((r) => r.v === 'TBC').length;
  h += '<p style="margin:10px 0 0;font-size:12px;color:#4A4F55">All vessels, whole horizon: <b>' + Math.round(tConf / tCap * 100) + '%</b> confirmed, +' + Math.round(tProp / tCap * 100) + '% proposed' + (tHeld ? ', ' + Math.round(tHeld / tCap * 100) + '% held (blocked, not running — h in the table)' : '') + '.' + (nT ? ' <span style="color:#9B1C1C">' + nT + ' run' + (nT > 1 ? 's' : '') + ' not yet assigned to a vessel — not counted above.</span>' : '') + '</p></section>';
  return h;
}

function renderTimeline(sel) {
  const t0 = Date.parse(START + 'T00:00:00'), t1 = Date.parse(END + 'T00:00:00') + 864e5, span = t1 - t0;
  const pct = (iso, endOfDay) => ((Date.parse(iso + 'T00:00:00') + (endOfDay ? 864e5 : 0) - t0) / span * 100);
  const LBL = 300;
  let h = '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;overflow-x:auto"><div style="min-width:1100px;padding:10px 12px 14px">';
  // month header
  h += '<div style="display:grid;grid-template-columns:' + LBL + 'px 1fr;align-items:end"><div></div><div style="position:relative;height:26px;border-bottom:1px solid #E1E2DC">';
  const d = new Date(START + 'T12:00:00'); d.setDate(1);
  while (d.getTime() < t1) {
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
    const left = Math.max(0, pct(iso));
    const nx = new Date(d); nx.setMonth(nx.getMonth() + 1);
    const visDays = (Math.min(nx.getTime(), t1) - Math.max(d.getTime(), t0)) / 864e5;
    const lbl = visDays < 12 ? '' : MON[d.getMonth()] + (d.getMonth() === 0 || !h.includes('data-firstm') ? ' ' + d.getFullYear() : '');
    h += '<div data-firstm style="position:absolute;left:' + left + '%;top:0;bottom:0;border-left:1px solid #D5D6D0;padding-left:6px;font-weight:700;font-size:12.5px;white-space:nowrap">' + lbl + '</div>';
    d.setMonth(d.getMonth() + 1);
  }
  h += '</div></div>';
  const tp = (todayIso >= START && todayIso <= END) ? pct(todayIso) + (100 / (span / 864e5)) / 2 : null;
  const keys = Object.keys(P).filter((k) => !sel || k === sel);
  THEMES.forEach(([n, label]) => {
    const ks = keys.filter((k) => P[k].theme === n).sort(byPri);
    if (!ks.length) return;
    if (!sel) h += '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5F6368;margin:14px 0 2px">' + esc(label) + '</div>';
    ks.forEach((k) => {
      const c = P[k].c, rows = (TL[k] || []).slice().sort((a, b2) => a.s < b2.s ? -1 : a.s > b2.s ? 1 : 0);
      h += '<div style="display:grid;grid-template-columns:' + LBL + 'px 1fr;border-top:1px solid #EEEEEA;margin-top:4px"><div style="display:flex;align-items:center;gap:8px;padding:8px 0 4px"><span style="width:12px;height:12px;border-radius:3px;background:' + c + ';flex:none"></span>' + priBadge(k) + '<span style="font-weight:700;font-size:13px">' + esc(P[k].name) + '</span>' + (sel ? '<button onclick="' + on(() => setState({ view: 'ov' })) + '" style="margin-left:auto;margin-right:12px;flex:none;white-space:nowrap;border:1px solid #C9CBC4;background:#FFFFFF;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px">Project card →</button>' : '') + '</div><div></div></div>';
      if (!rows.length) {
        h += '<div style="display:grid;grid-template-columns:' + LBL + 'px 1fr"><div style="padding:2px 0 8px 20px;font-size:11.5px;color:#6B7075">No plan yet' + (canEdit() ? ' — <button onclick="' + on(() => editTL(null, k)) + '" style="border:0;background:none;padding:0;color:#23699A;cursor:pointer;font-size:11.5px">add the first milestone</button>' : '') + '</div><div></div></div>';
        return;
      }
      if (!sel) {
        h += '<div style="display:grid;grid-template-columns:' + LBL + 'px 1fr;align-items:center;min-height:28px"><div style="padding:0 12px 6px 20px"><button onclick="' + on(() => setState({ sel: k })) + '" style="border:0;background:none;padding:0;color:#23699A;cursor:pointer;font-size:11.5px">' + rows.length + (rows.length === 1 ? ' item' : ' items') + ' — open plan →</button></div><div style="position:relative;height:100%;min-height:28px">';
        if (tp !== null) h += '<div style="position:absolute;left:' + tp + '%;top:0;bottom:0;border-left:2px solid #E0A526;z-index:0"></div>';
        rows.forEach((r) => {
          if (r.kind === 'ms') h += '<div title="' + esc(r.name + ' — ' + r.s) + '" style="position:absolute;left:calc(' + (pct(r.s) + (100 / (span / 864e5)) / 2) + '% - 6px);top:50%;width:10px;height:10px;margin-top:-5px;transform:rotate(45deg);background:' + (r.prop ? '#FFFFFF' : c) + ';border:2px solid ' + c + ';box-sizing:border-box;z-index:2"></div>';
          else { const l = pct(r.s), w = Math.max(pct(r.e, 1) - l, 0.6); h += '<div title="' + esc(r.name + ' — ' + r.s + ' → ' + r.e) + '" style="position:absolute;left:' + l + '%;width:' + w + '%;top:9px;bottom:9px;border-radius:4px;background:' + c + ';opacity:' + (r.prop ? .35 : .6) + ';z-index:1"></div>'; }
        });
        h += '</div></div>';

    if (isAdmin()) h += lk(applyUpdate, 'Apply PM update') + lk(adminLogout, 'Leave admin');

  return h + '</div>';
}
function logPanel() {
  if (!SYNC.showLog) return '';
  let h = '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;padding:14px 16px"><h2 style="margin:0 0 8px;font-size:15px">Recent changes</h2>';

  if (!SYNC.log.length) return h + '<div style="color:#6B7075">No changes yet.</div></section>';
  SYNC.log.slice(0, 40).forEach((r) => {
    const d = new Date(r.t);
    h += '<div style="display:grid;grid-template-columns:96px 70px 1fr;gap:10px;padding:5px 0;border-top:1px solid #EEEEEA;font-size:12px"><span style="font-family:\'IBM Plex Mono\',monospace;color:#5F6368">' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '</span><b>' + esc(r.who) + '</b><span>' + esc(r.op) + ' · ' + esc(r.s || '') + '</span></div>';

}

function render() {
  H.length = 0;

  const platOn = !!state.plat, routineOn = !!state.routine, loadOn = !!state.load, view = state.view || 'ov', tlv = view === 'tl', cal = view === 'cal', ves = (state.ves && state.ves.length) ? state.ves : null;

  let blocks = B.slice();

  const vbars = VR.map((r) => ({ plat: r.v === 'TBC' ? (r.fam === 'any' ? 'Vessel TBC' : r.fam + ' (vessel TBC)') : r.v, v: r.v, date: r.s, h: 0, len: (IDX[r.e] != null && IDX[r.s] != null) ? (IDX[r.e] - IDX[r.s]) * 2 + 2 : 2, p: r.p, t: r.t, prop: r.prop }));

  const chip = (on1, c) => 'min-height:36px;padding:0 14px;border-radius:999px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;border:1px solid ' + (on1 ? (c || '#1B1D1F') : '#C9CBC4') + ';background:' + (on1 ? (c || '#1B1D1F') : '#FFFFFF') + ';color:' + (on1 ? '#FFFFFF' : '#1B1D1F') + ';font-weight:500;';

  let h = '<div style="min-height:100vh;background:#F4F4F1;color:#1B1D1F;font-family:\'IBM Plex Sans\',system-ui,sans-serif;font-size:13px;box-sizing:border-box;padding:20px 24px 40px">';

  [['ov', 'Projects'], ['cal', 'Calendar'], ['tl', 'Timeline'], ['pl', 'Platforms']].forEach(([v, l], i) => { h += '<button onclick="' + on(() => setState({ view: v })) + '" aria-pressed="' + (view === v) + '" style="' + seg(view === v, i === 0) + '">' + l + '</button>'; });

  // view-specific toolbar (its own row, so the view tabs above never move)

  h += '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px">';
  h += '<button onclick="' + on(() => { const el = document.getElementById('wk' + Math.max(0, Math.floor(TODAY / 5))); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }) + '" style="' + chip(false) + '">Today</button>';
  h += '<button onclick="' + on(() => setState({ plat: !platOn })) + '" aria-pressed="' + platOn + '" style="' + chip(platOn) + '">Equipment strip</button>';
  h += '<button onclick="' + on(() => setState({ past: !state.past })) + '" aria-pressed="' + !!state.past + '" style="' + chip(!!state.past) + '">Past weeks</button>';
  h += '<button onclick="' + on(() => setState({ routine: !routineOn })) + '" aria-pressed="' + routineOn + '" style="' + chip(routineOn) + '">Routine</button>';
  h += '<button onclick="' + on(() => setState({ load: !loadOn })) + '" aria-pressed="' + loadOn + '" style="' + chip(loadOn) + '">Load</button>';
  if (canEdit()) h += '<button onclick="' + on(() => editBlock(null)) + '" style="' + chip(true, '#2B6CB0') + 'margin-left:auto">+ Add task</button>';
  h += '</div>';
  }

  // person filter row

  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px">';

  });
  h += '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#4A4F55"><span style="display:inline-block;width:34px;height:18px;border-radius:5px;background:#5F6368;outline:2px dashed rgba(255,255,255,.85);outline-offset:-4px"></span>dashed = proposed, not yet confirmed</span>';

  h += '</div>';
  } else h += '<div style="margin-bottom:16px;font-size:12.5px;color:#4A4F55">' + ({ ov: 'Goals and the high-level plan for each project. Pick one on the left to focus.', tl: 'Each project in one line. Click a project for its phases and milestones; dashed = proposed.', pl: 'What each bioreactor vessel is booked for, and how busy it is.' })[view] + '</div>';

  // layout
  h += '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">';
  h += '<aside style="flex:1 1 220px;max-width:260px;min-width:0;background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;padding:14px">';
  h += '<button onclick="' + on(() => setState({ sel: null })) + '" style="width:100%;min-height:40px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;text-align:left;border:1px solid ' + (sel ? '#E1E2DC' : '#1B1D1F') + ';background:' + (sel ? '#FFFFFF' : '#1B1D1F') + ';color:' + (sel ? '#1B1D1F' : '#FFFFFF') + '">All projects</button>';
  THEMES.forEach(([n, label]) => {
    h += '<div style="margin-top:14px"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5F6368;margin-bottom:4px;line-height:1.4">' + esc(label) + '</div>';
    Object.keys(P).filter((k) => P[k].theme === n).sort(byPri).forEach((k) => {
      const onp = sel === k;
      h += '<button onclick="' + on(() => setState({ sel: onp ? null : k })) + '" style="display:flex;gap:9px;align-items:center;width:100%;min-height:40px;padding:6px 8px;margin-bottom:2px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#1B1D1F;text-align:left;border:1px solid ' + (onp ? P[k].c : 'transparent') + ';background:' + (onp ? P[k].c + '14' : 'transparent') + '"><span style="width:12px;height:12px;border-radius:3px;background:' + P[k].c + ';flex:none"></span><span style="font-weight:600;flex:1;min-width:0">' + esc(P[k].name) + '</span>' + priBadge(k) + '</button>';
    });
    h += '</div>';
  });
  h += '</aside><main style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px">';

  h += logPanel();
  if (!Object.keys(P).length) h += '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;padding:28px;text-align:center;color:#4A4F55;font-size:14px">' + (!effKey() ? 'Open the planner once with the team link (ask Yoni for it). After that this address works on its own.' : SYNC.status === 'empty' ? 'The planner sheet is empty.' : SYNC.status === 'error' ? 'Couldn’t load the plan: ' + esc(SYNC.err) : 'Loading the plan…') + '</section>';
  else if (view === 'ov') h += renderOverview(sel);
  else if (tlv) h += renderTimeline(sel);
  else if (view === 'pl') h += renderPlatforms(sel);
  else for (let w = state.past ? 0 : CURW; w < NWEEKS; w++) {
    const lo = w * 10, hi = lo + 10;
    const items = [];
    blocks.forEach((x) => {
      const s = slot(x), e = s + x.len, a = Math.max(s, lo), z = Math.min(e, hi);
      if (z > a) items.push({ kind: 'b', x, a: a - lo, len: z - a });
    });
    items.sort((p, q) => p.a - q.a || q.len - p.len);
    if (routineOn) for (let d = 0; d < 5; d++) ['nadav', 'dorin'].filter((k) => !who || who.includes(k)).forEach((k) => items.push({ kind: 'r', k, a: d * 2, len: 2 }));
    const nRows = Math.max(3, pack(items) + 1); // always at least 3 rows + one free row, like an empty calendar

    h += '<section id="wk' + w + '" style="scroll-margin-top:12px;background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;overflow-x:auto"><div style="min-width:1000px;padding:10px 12px 12px">';
    h += '<div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto auto">';

    }
    for (let i = 0; i < 10; i++) h += '<div style="grid-column:' + (i + 1) + ';grid-row:2;font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;color:#6B7075;padding:0 0 4px 8px;' + (i % 2 ? '' : 'border-left:1px solid #E4E4DF;') + '">' + (i % 2 ? 'PM' : 'AM') + '</div>';
    h += '</div>';

    h += '<div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(' + nRows + ',minmax(34px,auto))">';
    for (let i = 0; i < 5; i++) {
      const di = w * 5 + i;
      h += '<div style="grid-column:' + (i * 2 + 1) + ' / span 2;grid-row:1 / span ' + nRows + ';border-left:1px solid #E4E4DF;background:' + (di === TODAY ? '#FFF7E3' : (di < TODAY ? '#FAFAF8' : 'transparent')) + '"></div>';
    }
    for (let r = 0; r < nRows; r++) for (let i = 0; i < 10; i++) {
      const di = w * 5 + (i >> 1), free = canEdit() && di >= TODAY;
      h += '<div class="cell"' + (free ? ' title="Click to add a task here" onclick="' + on(() => editBlock(null, { date: DAYS[di].iso, h: i % 2 })) + '"' : '') + ' style="grid-column:' + (i + 1) + ';grid-row:' + (r + 1) + ';border-top:1px solid #EEEEEA;border-left:1px ' + (i % 2 ? 'dotted #E9E9E4' : 'solid #E4E4DF') + ';' + (i === 9 ? 'border-right:1px solid #E4E4DF;' : '') + (r === nRows - 1 ? 'border-bottom:1px solid #EEEEEA;' : '') + (free ? 'cursor:pointer;' : '') + '"></div>';
    }
    items.forEach((it) => {
      const pos = 'grid-column:' + (it.a + 1) + ' / span ' + it.len + ';grid-row:' + (it.row + 1) + ';';
      if (it.kind === 'r') {
        const pp = PEOPLE[it.k];
        h += '<div title="' + esc(pp.name + ' — routine: ' + pp.routineText) + '" style="' + pos + 'margin:2px;padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:6px;min-width:0;position:relative;z-index:1;background:#ECEDE8;color:#3F444A;font-size:10.5px;opacity:' + (sel ? .3 : 1) + '"><span style="width:16px;height:16px;border-radius:50%;background:' + pp.c + ';color:#FFFFFF;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">' + pp.name[0] + '</span><span style="overflow-wrap:anywhere">' + esc(pp.name) + ' · routine</span></div>';
        return;
      }
      const x = it.x, pp = PEOPLE[x.lane] || PEOPLE.yoni, c = (P[x.p] || { c: '#999' }).c, dim = sel && x.p !== sel, hit = sel && x.p === sel;
      const done = x.st === 'done', blk = x.st === 'blocked';
      h += '<div class="blk' + (x.prop ? ' prop' : '') + '"' + (canEdit() ? ' onclick="' + on(() => editBlock(x)) + '"' : '') + ' title="' + esc(ttl(x) + '\n' + namesOf(x) + ' · ' + (P[x.p] || { name: '?' }).name + ' · ' + fmt(x.len * .5) + ' d' + (x.prop ? ' · proposed' : '') + (x.st ? ' · ' + x.st : '') + (x.t && x.t !== ttl(x) ? '\n\n' + x.t : '') + (x.note ? '\n\nNote: ' + x.note : '') + (x.by ? '\n\nlast change: ' + x.by : '') + (canEdit() ? '\n(click to edit)' : '')) + '" style="' + pos + 'background:' + c + ';opacity:' + (dim ? .15 : done ? .5 : 1) + ';' + (canEdit() ? 'cursor:pointer;' : '') + (hit ? 'box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px ' + c + ';' : '') + (blk ? 'box-shadow:0 0 0 3px #E53E3E;' : '') + '"><span style="display:flex;flex:none">' + whoOf(x).map((k, i) => { const q = PEOPLE[k] || pp; return '<span class="dot" style="background:' + q.c + (i ? ';margin-left:-7px' : '') + '">' + (i === 0 && done ? '✓' : i === 0 && blk ? '!' : q.name[0]) + '</span>'; }).join('') + '</span><span class="tx"' + (done ? ' style="text-decoration:line-through"' : '') + '>' + esc(ttl(x)) + (x.note ? ' <span style="opacity:.8">✎</span>' : '') + '</span></div>';

    h += '</div>';

    if (platOn) {

      pit.sort((p, q) => p.a - q.a || q.len - p.len);
      const pr = Math.max(1, pack(pit));
      h += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #E1E2DC"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5F6368;margin-bottom:4px">Platforms</div><div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(' + pr + ',minmax(26px,auto))">';

  if (cal) {

render();
// Usage tracking: one quiet "opened" note per person per day (for Yoni's morning usage report)
function pingVisit() {
  if (!effKey() || !SYNC.who) return;
  const d = new Date().toDateString();
  if (SYNC.visitDay === d) return;
  SYNC.visitDay = d;
  fetch(SYNC_URL + '?action=visit&key=' + encodeURIComponent(effKey()) + '&who=' + encodeURIComponent(SYNC.who) + '&dev=' + (/Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'phone' : 'desktop') + '&t=' + Date.now()).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pingVisit(); });
if (effKey()) { syncGet(true).then(() => { if (SYNC.role && !SYNC.who) pickWho(); else pingVisit(); }); }
