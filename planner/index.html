</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= DATA — edit here ================= */
const START = '2026-10-25';   // first Sunday shown
const NWEEKS = 4;             // Sun–Thu weeks shown

const THEMES = [
  [1, '1 · Keep the line alive'],
  [2, '2 · Make it work at home'],
  [3, '3 · Support strawberry product (production & marketing)'],
  [4, '4 · Innovate & improve'],
  [5, 'Team']
];
const P = {
  'cell-supply':   { name: 'Cell supply', theme: 1, c: '#1F7A5A' },
  'cell-line':     { name: 'Cell line — investigate, rebuild, back up', theme: 1, c: '#0E5E6F' },
  'bpd-baseline':  { name: 'BPD — clean baseline', theme: 2, c: '#1F5FAF' },
  'contamination': { name: 'Contamination & 5S', theme: 2, c: '#3D4FA8' },
  'analytical':    { name: 'Analytical methods (PSD, TTC, FDA)', theme: 2, c: '#23699A' },
  'media-v1':      { name: 'Media V1', theme: 3, c: '#A0561A' },
  'gras':          { name: 'GRAS dossier', theme: 3, c: '#7C3F12' },
  'drying-dsp':    { name: 'Drying & DSP', theme: 3, c: '#8C6200' },
  'chemo':         { name: 'Chemo support', theme: 3, c: '#C2410C' },
  'functionality': { name: 'Functionality', theme: 3, c: '#9F1239' },
  'proc-val':      { name: 'Process validation', theme: 3, c: '#5E6B1F' },
  'bpd-opt':       { name: 'BPD — optimization (DOE)', theme: 4, c: '#6B4FA0' },
  'media-v2':      { name: 'Media V2 (hormones, metals)', theme: 4, c: '#8E3F8E' },
  'antifoam':      { name: 'Antifoam', theme: 4, c: '#A23B72' },
  'new-lines':     { name: 'New lines (tomato, citrus)', theme: 4, c: '#5B3D7A' },
  'team':          { name: 'Team & hiring', theme: 5, c: '#4A5568' }
};
const PEOPLE = {
  yoni:  { name: 'Yoni',  c: '#2B6CB0', routine: 0, cap: 5 },
  nadav: { name: 'Nadav', c: '#B7410E', routine: 1, cap: 5, routineText: 'daily sampling & checks' },
  dorin: { name: 'Dorin', c: '#2F855A', routine: 1, cap: 5, routineText: 'media prep, housekeeping' },
  or:    { name: 'Or',    c: '#6B46C1', routine: 0, cap: null },
  tech:  { name: 'Technician', c: '#4A5568', routine: 0, cap: 5 }
};

// b(lane, date, half 0=AM 1=PM, length in half-days, project, text, opts)
// opts: {prop:1} = proposed (dashed), {tt:1} = moves to technician in "+ Technician" view
const b = (lane, date, h, len, p, t, o) => Object.assign({ lane, date, h, len, p, t }, o || {});
const B = [
  // ---- Week of 25 Oct ----
  b('yoni', '2026-10-28', 1, 1, 'cell-line', '"What changed" meeting w/ Shimrit → workplan'),
  b('nadav','2026-10-28', 1, 1, 'cell-line', '"What changed" meeting w/ Shimrit'),
  b('dorin','2026-10-28', 1, 1, 'cell-line', '"What changed" meeting w/ Shimrit'),
  b('or',   '2026-10-28', 1, 1, 'cell-line', '"What changed" meeting w/ Shimrit'),
  b('nadav','2026-10-28', 0, 1, 'bpd-baseline', 'STR16 stopped — contaminated'),
  b('nadav','2026-10-29', 0, 1, 'cell-line', 'Count bank + TTC with Or → go / no-go'),
  b('or',   '2026-10-29', 0, 1, 'cell-line', 'Count Nadav’s bank + TTC with Nadav'),
  b('nadav','2026-10-29', 1, 1, 'bpd-baseline', 'Seed DG5 (if bank OK)'),
  b('yoni', '2026-10-29', 1, 1, 'analytical', 'PSD: quick scanner test (if time)', { prop: 1 }),

  // ---- Week of 1 Nov ----
  b('dorin','2026-11-01', 0, 1, 'cell-line', 'Split best sub-line → +2 flasks for new bank'),
  b('dorin','2026-11-01', 1, 1, 'cell-line', 'Plate→liquid line: weekly 2 flasks'),
  b('dorin','2026-11-02', 0, 1, 'chemo', 'Chemo batches: TPC plating', { prop: 1 }),
  b('dorin','2026-11-03', 0, 2, 'media-v1', '50/50 end: count + data', { prop: 1 }),
  b('dorin','2026-11-05', 0, 1, 'chemo', 'Chemo TPC: read plates', { prop: 1 }),

  b('nadav','2026-11-01', 0, 1, 'bpd-baseline', 'Define pass criteria for clean semi run', { prop: 1 }),
  b('nadav','2026-11-01', 1, 1, 'contamination', 'Hands-on reactor clean w/ Yoni (dip tubes, filters)', { prop: 1 }),
  b('nadav','2026-11-02', 0, 1, 'contamination', 'Autoclave indicators: large — media + harvest bottles', { prop: 1, tt: 1 }),
  b('nadav','2026-11-03', 0, 1, 'contamination', 'Autoclave indicators: small — MF vessels', { prop: 1, tt: 1 }),
  b('nadav','2026-11-04', 0, 1, 'contamination', 'Autoclave indicators: large — Dasgip vessels', { prop: 1, tt: 1 }),
  b('nadav','2026-11-04', 1, 1, 'bpd-baseline', 'pH probe calibration / drift check', { prop: 1 }),
  b('nadav','2026-11-05', 0, 1, 'cell-supply', 'Thursday bank'),

  b('yoni', '2026-11-01', 0, 1, 'team', 'Technician: post job, start hiring', { prop: 1 }),
  b('yoni', '2026-11-01', 1, 1, 'contamination', 'Hands-on reactor clean w/ Nadav → cleaning SOP', { prop: 1 }),
  b('yoni', '2026-11-02', 0, 2, 'bpd-baseline', 'Report: how we measure cell density now, going forward, and why', { prop: 1 }),
  b('yoni', '2026-11-03', 0, 3, 'cell-line', 'Sub-line analysis: aggregates × doubling time × pH × Brix', { prop: 1 }),
  b('yoni', '2026-11-04', 1, 1, 'cell-line', 'Line 56 vs 41 comparison graph', { prop: 1 }),
  b('yoni', '2026-11-05', 0, 1, 'cell-line', 'Room temp logs + AC back to 24 °C', { prop: 1 }),
  b('yoni', '2026-11-05', 1, 1, 'analytical', 'PSD rig: camera/old phone, light box, black background', { prop: 1 }),

  b('or',   '2026-11-01', 0, 1, 'drying-dsp', 'Ask ECL: biomass amount + freeze thickness', { prop: 1 }),
  b('or',   '2026-11-02', 0, 2, 'chemo', 'Bubble reactor (10–20 L carboy): design', { prop: 1 }),
  b('or',   '2026-11-04', 0, 1, 'drying-dsp', 'Dry freezer samples', { prop: 1 }),

  // ---- Week of 8 Nov ----
  b('dorin','2026-11-08', 0, 1, 'cell-line', 'Hand ~30–39 g to Nadav for new bank'),
  b('dorin','2026-11-08', 1, 1, 'cell-line', 'Cryo pilot: drying curve in hood (day −8)', { prop: 1 }),
  b('dorin','2026-11-09', 0, 1, 'cell-line', 'Plate→liquid line: weekly 2 flasks'),
  b('dorin','2026-11-12', 0, 1, 'cell-line', 'Cryo: subculture for ~12 ml packed cells (day −4)', { prop: 1 }),

  b('nadav','2026-11-08', 0, 1, 'cell-line', 'Receive cells from Dorin → start own bank'),
  b('nadav','2026-11-09', 0, 1, 'contamination', 'Blind media hold: set up (no cells)', { prop: 1 }),
  b('nadav','2026-11-12', 0, 1, 'cell-supply', 'Thursday bank'),

  b('yoni', '2026-11-08', 0, 2, 'contamination', '5S: do reference area myself + photo standard', { prop: 1 }),
  b('yoni', '2026-11-09', 0, 2, 'contamination', 'Contamination plan: room setup, Dec renovation option, cleaning log', { prop: 1 }),
  b('yoni', '2026-11-10', 0, 1, 'bpd-baseline', 'pH: compare with Chemo full log', { prop: 1 }),
  b('yoni', '2026-11-10', 1, 2, 'analytical', 'PSD: camera method vs Mastersizer', { prop: 1 }),

  b('or',   '2026-11-08', 0, 1, 'functionality', 'Non-viability study: plate powder', { prop: 1 }),
  b('or',   '2026-11-10', 0, 1, 'chemo', 'Bubble reactor: parts + build plan', { prop: 1 }),

  // ---- Week of 15 Nov ----
  b('dorin','2026-11-15', 0, 1, 'cell-line', 'Plate→liquid line: weekly 2 flasks'),
  b('dorin','2026-11-15', 1, 1, 'cell-line', 'Cryo prep: alginate, CaCl₂, sucrose media, ST24 plates (day −1)', { prop: 1 }),
  b('dorin','2026-11-16', 0, 2, 'cell-line', 'Cryo day 0: TTC, 2 bead lots → 8 sucrose lots', { prop: 1 }),
  b('dorin','2026-11-17', 0, 1, 'cell-line', 'Cryo day 1: sucrose steps', { prop: 1 }),
  b('dorin','2026-11-18', 0, 1, 'cell-line', 'Cryo day 2: sucrose steps', { prop: 1 }),
  b('dorin','2026-11-18', 1, 1, 'media-v1', 'Filter vs autoclave end: count + data', { prop: 1 }),
  b('dorin','2026-11-19', 0, 2, 'cell-line', 'Cryo day 3: dry all lots in hood + TTC', { prop: 1 }),

  b('nadav','2026-11-15', 0, 1, 'cell-line', 'Bank expansion (target ~50 g to seed)', { prop: 1 }),
  b('nadav','2026-11-17', 0, 1, 'contamination', 'Blind media hold: read out', { prop: 1 }),
  b('nadav','2026-11-19', 0, 1, 'cell-supply', 'Thursday bank'),

  b('yoni', '2026-11-15', 0, 2, 'contamination', '5S: others do remaining areas — Yoni signs off each', { prop: 1 }),
  b('yoni', '2026-11-17', 0, 2, 'analytical', 'TTC quantification method', { prop: 1 }),

  b('or',   '2026-11-16', 0, 1, 'drying-dsp', 'Validate ECL freeze conditions (once ECL answers)', { prop: 1 }),

  // ---- Technician scenario only ----
  b('tech', '2026-11-02', 0, 1, 'contamination', 'Autoclave indicators: large — media + harvest bottles', { prop: 1 }),
  b('tech', '2026-11-03', 0, 1, 'contamination', 'Autoclave indicators: small — MF vessels', { prop: 1 }),
  b('tech', '2026-11-04', 0, 1, 'contamination', 'Autoclave indicators: large — Dasgip vessels', { prop: 1 }),
  b('tech', '2026-11-11', 0, 4, 'chemo', 'Bubble reactor build (with Or)', { prop: 1 }),
  b('tech', '2026-11-16', 0, 4, 'chemo', 'Bubble reactor sterility + first test', { prop: 1 })
];

// Platforms: pb(platform, date, half, len, project, text, opts)
const pb = (plat, date, h, len, p, t, o) => Object.assign({ plat, date, h, len, p, t }, o || {});
const PB = [
  pb('Dasgip DG5', '2026-10-29', 1, 26, 'bpd-baseline', 'DG5 run (if seeded) — end TBD', { prop: 1 }),
  pb('Flasks', '2026-10-25', 0, 18, 'media-v1', '50/50 spent media → 3 Nov', { prop: 1 }),
  pb('Flasks', '2026-10-25', 0, 38, 'media-v1', 'Filter vs autoclave → 18 Nov', { prop: 1 }),
  pb('Flasks', '2026-11-01', 0, 30, 'cell-line', 'New line: 2 flasks / week'),
  pb('Flasks', '2026-11-16', 0, 8, 'cell-line', 'Cryo: 8 sucrose lots', { prop: 1 }),
  pb('MF (TBD)', '2026-11-09', 0, 14, 'contamination', 'Blind media hold', { prop: 1 })
];

// Not on the calendar yet: [project, name, need/blocker, status now, status with technician]
const Q = [
  ['bpd-baseline', 'Clean semi-continuous run (bioreactor)', 'Gated on: contamination under control + confirmed good line. Fallback if it fails: perfusion baseline, semi moves to Media V1.', 'gated', 'gated'],
  ['chemo', 'Bubble reactor 10–20 L: build → runs', 'Or leads; execution needs Nadav time', 'needs Nadav', 'on calendar 11 Nov'],
  ['bpd-opt', 'DOE: temperature deep-dive (then pH, DO)', 'Dasgip + Nadav; best temp, reversibility, product attributes', 'after baseline', 'after baseline'],
  ['media-v1', 'Glucose correction to rescue 50% (flasks)', 'A flask slot + Dorin', 'after 3 Nov', 'after 3 Nov'],
  ['media-v2', 'Metal reduction', 'Dorin; hormone-reduction data not promising so far', 'no date', 'no date'],
  ['antifoam', 'Develop a working antifoam (Munzing)', 'Spun off from BPD baseline goal #2', 'no owner', 'no owner'],
  ['new-lines', 'Tomato: revive in suspension + process', 'Owner and start TBD', 'no owner', 'no owner'],
  ['new-lines', 'Citrus: get a line into suspension', 'Solid only so far; owner TBD', 'no owner', 'no owner'],
  ['proc-val', 'Process validation: parameter limits × metabolomics', 'Needs a clean baseline first', 'after baseline', 'after baseline'],
  ['functionality', 'GLP-1 simulated study (2× gastric retention)', 'Owner and dates TBD', 'no owner', 'no owner'],
  ['drying-dsp', 'Criofarma bag tests', 'Or; waiting on bags', 'waiting', 'waiting'],
  ['analytical', 'FDA viability: explore', 'Yoni; after PSD and TTC', 'no date', 'no date'],
  ['team', 'Nadav away in December', 'Cover runs + bank; natural renovation window (Shimrit ↔ Einat)', 'plan cover', 'plan cover'],
  ['gras', 'GRAS dossier', 'Shimrit runs it; reagent to Technion for HPLC. Check in with her later.', 'Shimrit', 'Shimrit'],
  ['cell-line', 'Low priority: metabolomics samples (Shimrit), Microsynth DNA question', 'Only if cheap and no team time', 'no date', 'no date']
];

/* ================= ENGINE ================= */
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = [];
(function () {
  const d0 = new Date(START + 'T12:00:00');
  for (let w = 0; w < NWEEKS; w++) for (let i = 0; i < 5; i++) {
    const d = new Date(d0); d.setDate(d0.getDate() + w * 7 + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    DAYS.push({ iso, day: DAYN[i], date: d.getDate() + ' ' + MON[d.getMonth()] });
  }
})();
const IDX = {}; DAYS.forEach((d, i) => IDX[d.iso] = i);
const todayIso = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
const TODAY = IDX[todayIso] ?? -1;

let state = {};
const H = [];
function setState(p) { state = Object.assign({}, state, p); render(); }
function on(fn) { H.push(fn); return 'H[' + (H.length - 1) + ']()'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
const fmt = (x) => (Math.round(x * 2) / 2).toString();
const slot = (it) => (IDX[it.date] ?? -999) * 2 + it.h;

function pack(list) {
  const rows = [];
  list.forEach((it) => {
    let r = 0;
    while (rows[r] && rows[r].some((o) => it.a < o.z && o.a < it.a + it.len)) r++;
    (rows[r] = rows[r] || []).push({ a: it.a, z: it.a + it.len });
    it.row = r;
  });
  return rows.length;
}

function render() {
  H.length = 0;
  const sel = state.sel || null, tech = !!state.tech, who = state.who || null;
  const platOn = !!state.plat, routineOn = !!state.routine, loadOn = !!state.load;

  let blocks = B.filter((x) => (x.lane === 'tech' ? tech : !(tech && x.tt)));
  if (who) blocks = blocks.filter((x) => x.lane === who);
  const bars = PB;

  const seg = (on1, first) => 'border:0;' + (first ? '' : 'border-left:1px solid #E1E2DC;') + 'padding:0 14px;min-height:36px;cursor:pointer;' + (on1 ? 'background:#1B1D1F;color:#FFFFFF;font-weight:600;' : 'background:#FFFFFF;color:#1B1D1F;');
  const chip = (on1, c) => 'min-height:36px;padding:0 14px;border-radius:999px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;border:1px solid ' + (on1 ? (c || '#1B1D1F') : '#C9CBC4') + ';background:' + (on1 ? (c || '#1B1D1F') : '#FFFFFF') + ';color:' + (on1 ? '#FFFFFF' : '#1B1D1F') + ';font-weight:' + (on1 ? 600 : 400) + ';';

  let h = '<div style="min-height:100vh;background:#F4F4F1;color:#1B1D1F;font-family:\'IBM Plex Sans\',system-ui,sans-serif;font-size:13px;box-sizing:border-box;padding:20px 24px 40px">';
  // header
  h += '<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px"><div>';
  h += '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5F6368">Novella · Modi\'in R&amp;D</div>';
  h += '<h1 style="margin:4px 0 0;font-size:26px;font-weight:700;letter-spacing:-.01em">Who is doing what, when</h1></div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">';
  h += '<div style="display:flex;border:1px solid #C9CBC4;border-radius:8px;overflow:hidden;background:#FFFFFF">';
  h += '<button onclick="' + on(() => setState({ tech: false })) + '" style="' + seg(!tech, true) + '">Current team</button>';
  h += '<button onclick="' + on(() => setState({ tech: true })) + '" style="' + seg(tech, false) + '">+ Technician</button></div>';
  h += '<button onclick="' + on(() => setState({ plat: !platOn })) + '" aria-pressed="' + platOn + '" style="' + chip(platOn) + '">Platforms</button>';
  h += '<button onclick="' + on(() => setState({ routine: !routineOn })) + '" aria-pressed="' + routineOn + '" style="' + chip(routineOn) + '">Routine</button>';
  h += '<button onclick="' + on(() => setState({ load: !loadOn })) + '" aria-pressed="' + loadOn + '" style="' + chip(loadOn) + '">Load</button>';
  h += '</div></header>';

  // person filter row
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px">';
  h += '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5F6368;margin-right:4px">Show</span>';
  h += '<button onclick="' + on(() => setState({ who: null })) + '" aria-pressed="' + !who + '" style="' + chip(!who) + '">Everyone</button>';
  Object.keys(PEOPLE).filter((k) => k !== 'tech' || tech).forEach((k) => {
    const pp = PEOPLE[k], onp = who === k;
    h += '<button onclick="' + on(() => setState({ who: onp ? null : k })) + '" aria-pressed="' + onp + '" style="' + chip(onp, pp.c) + '"><span style="width:18px;height:18px;border-radius:50%;background:' + pp.c + ';color:#FFFFFF;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #FFFFFF">' + pp.name[0] + '</span>' + esc(pp.name) + '</button>';
  });
  h += '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#4A4F55"><span style="display:inline-block;width:34px;height:18px;border-radius:5px;background:#5F6368;outline:2px dashed rgba(255,255,255,.85);outline-offset:-4px"></span>dashed = proposed, not yet confirmed</span>';
  h += '</div>';

  // layout
  h += '<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">';
  h += '<aside style="flex:1 1 220px;max-width:260px;min-width:0;background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;padding:14px">';
  h += '<button onclick="' + on(() => setState({ sel: null })) + '" style="width:100%;min-height:40px;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;text-align:left;border:1px solid ' + (sel ? '#E1E2DC' : '#1B1D1F') + ';background:' + (sel ? '#FFFFFF' : '#1B1D1F') + ';color:' + (sel ? '#1B1D1F' : '#FFFFFF') + '">All projects</button>';
  THEMES.forEach(([n, label]) => {
    h += '<div style="margin-top:14px"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5F6368;margin-bottom:4px;line-height:1.4">' + esc(label) + '</div>';
    Object.keys(P).filter((k) => P[k].theme === n).forEach((k) => {
      const onp = sel === k;
      h += '<button onclick="' + on(() => setState({ sel: onp ? null : k })) + '" style="display:flex;gap:9px;align-items:center;width:100%;min-height:40px;padding:6px 8px;margin-bottom:2px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#1B1D1F;text-align:left;border:1px solid ' + (onp ? P[k].c : 'transparent') + ';background:' + (onp ? P[k].c + '14' : 'transparent') + '"><span style="width:12px;height:12px;border-radius:3px;background:' + P[k].c + ';flex:none"></span><span style="font-weight:600">' + esc(P[k].name) + '</span></button>';
    });
    h += '</div>';
  });
  h += '</aside><main style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px">';

  for (let w = 0; w < NWEEKS; w++) {
    const lo = w * 10, hi = lo + 10;
    const items = [];
    blocks.forEach((x) => {
      const s = slot(x), e = s + x.len, a = Math.max(s, lo), z = Math.min(e, hi);
      if (z > a) items.push({ kind: 'b', x, a: a - lo, len: z - a });
    });
    items.sort((p, q) => p.a - q.a || q.len - p.len);
    if (routineOn) for (let d = 0; d < 5; d++) ['nadav', 'dorin'].filter((k) => !who || who === k).forEach((k) => items.push({ kind: 'r', k, a: d * 2, len: 2 }));
    const nRows = Math.max(3, pack(items));

    h += '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;overflow-x:auto"><div style="min-width:1000px;padding:10px 12px 12px">';
    h += '<div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto auto">';
    for (let i = 0; i < 5; i++) {
      const di = w * 5 + i, dd = DAYS[di], isT = di === TODAY;
      h += '<div style="grid-column:' + (i * 2 + 1) + ' / span 2;grid-row:1;padding:4px 8px;border-left:1px solid #E4E4DF;' + (isT ? 'background:#FFF7E3;border-radius:6px 6px 0 0;' : '') + '"><span style="font-weight:700;font-size:14px">' + dd.day + '</span><span style="font-size:12px;color:#5F6368;margin-left:6px">' + dd.date + (isT ? ' · today' : '') + '</span></div>';
    }
    for (let i = 0; i < 10; i++) h += '<div style="grid-column:' + (i + 1) + ';grid-row:2;font-family:\'IBM Plex Mono\',monospace;font-size:9.5px;color:#6B7075;padding:0 0 4px 8px;' + (i % 2 ? '' : 'border-left:1px solid #E4E4DF;') + '">' + (i % 2 ? 'PM' : 'AM') + '</div>';
    h += '</div>';

    h += '<div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(' + nRows + ',minmax(34px,auto))">';
    for (let i = 0; i < 5; i++) {
      const di = w * 5 + i;
      h += '<div style="grid-column:' + (i * 2 + 1) + ' / span 2;grid-row:1 / span ' + nRows + ';border-left:1px solid #E4E4DF;background:' + (di === TODAY ? '#FFF7E3' : (di < TODAY ? '#FAFAF8' : 'transparent')) + '"></div>';
    }
    items.forEach((it) => {
      const pos = 'grid-column:' + (it.a + 1) + ' / span ' + it.len + ';grid-row:' + (it.row + 1) + ';';
      if (it.kind === 'r') {
        const pp = PEOPLE[it.k];
        h += '<div title="' + esc(pp.name + ' — routine: ' + pp.routineText) + '" style="' + pos + 'margin:2px;padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:6px;min-width:0;position:relative;z-index:1;background:#ECEDE8;color:#3F444A;font-size:10.5px;opacity:' + (sel ? .3 : 1) + '"><span style="width:16px;height:16px;border-radius:50%;background:' + pp.c + ';color:#FFFFFF;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none">' + pp.name[0] + '</span><span style="overflow-wrap:anywhere">' + esc(pp.name) + ' · routine</span></div>';
        return;
      }
      const x = it.x, pp = PEOPLE[x.lane], c = P[x.p].c, dim = sel && x.p !== sel, hit = sel && x.p === sel;
      h += '<div class="blk' + (x.prop ? ' prop' : '') + '" title="' + esc(pp.name + ' · ' + P[x.p].name + ' — ' + x.t + ' (' + fmt(x.len * .5) + ' d)' + (x.prop ? ' · proposed' : '')) + '" style="' + pos + 'background:' + c + ';opacity:' + (dim ? .15 : 1) + ';' + (hit ? 'box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px ' + c + ';' : '') + '"><span class="dot" style="background:' + pp.c + '">' + pp.name[0] + '</span><span class="tx">' + esc(x.t) + '</span></div>';
    });
    h += '</div>';

    if (platOn) {
      const pit = [];
      bars.forEach((x) => { const s = slot(x), e = s + x.len, a = Math.max(s, lo), z = Math.min(e, hi); if (z > a) pit.push({ x, a: a - lo, len: z - a }); });
      pit.sort((p, q) => p.a - q.a || q.len - p.len);
      const pr = Math.max(1, pack(pit));
      h += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #E1E2DC"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5F6368;margin-bottom:4px">Platforms</div><div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(' + pr + ',minmax(26px,auto))">';
      pit.forEach((it) => {
        const c = P[it.x.p].c, dim = sel && it.x.p !== sel;
        h += '<div title="' + esc(it.x.plat + ' — ' + it.x.t) + '" style="grid-column:' + (it.a + 1) + ' / span ' + it.len + ';grid-row:' + (it.row + 1) + ';margin:2px;padding:3px 8px;border-radius:10px;font-size:10.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;min-width:0;background:' + c + '1F;border:1px ' + (it.x.prop ? 'dashed' : 'solid') + ' ' + c + ';color:' + c + ';opacity:' + (dim ? .15 : 1) + '">' + esc(it.x.plat + ' · ' + it.x.t) + '</div>';
      });
      h += '</div></div>';
    }

    if (loadOn) {
      h += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #E1E2DC;display:flex;flex-wrap:wrap;gap:8px">';
      Object.keys(PEOPLE).filter((k) => (k !== 'tech' || tech) && (!who || who === k)).forEach((k) => {
        const pp = PEOPLE[k];
        let d = pp.routine;
        B.filter((x) => (x.lane === 'tech' ? tech : !(tech && x.tt)) && x.lane === k).forEach((x) => { const s = slot(x); for (let i = s; i < s + x.len; i++) if (i >= lo && i < hi) d += .5; });
        const over = pp.cap && d > pp.cap;
        h += '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;padding:4px 10px;border-radius:999px;' + (over ? 'background:#FDE3E3;color:#9B1C1C;font-weight:600;' : 'background:#F0F1EC;color:#2D3135;') + '">' + esc(pp.name + ' ' + fmt(d) + (pp.cap ? ' / ' + pp.cap : '') + ' d') + '</span>';
      });
      h += '</div>';
    }
    h += '</div></section>';
  }

  // queue
  h += '<section style="background:#FFFFFF;border:1px solid #E1E2DC;border-radius:12px;padding:16px 18px">';
  h += '<h2 style="margin:0;font-size:17px">' + (tech ? 'With a technician: what moves' : 'Not on the calendar yet') + '</h2>';
  h += '<p style="margin:6px 0 10px;line-height:1.5;color:#2D3135">' + (tech ? 'The technician takes the autoclave-indicator runs and the bubble-reactor build off Nadav. Most other items still need an owner or a gate to clear, not hands.' : 'Planned work with no slot yet — gated, waiting, or without an owner.') + '</p>';
  Q.forEach(([p, name, need, now, wt]) => {
    const v = tech ? wt : now, good = v.indexOf('on calendar') === 0, red = v === 'needs Nadav' || v === 'plan cover';
    h += '<div style="display:grid;grid-template-columns:12px minmax(0,1fr) 130px;gap:10px;padding:8px 0;border-top:1px solid #EEEEEA;align-items:start;opacity:' + (sel && p !== sel ? .3 : 1) + '"><span style="width:10px;height:10px;border-radius:3px;margin-top:4px;background:' + P[p].c + '"></span>';
    h += '<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:600">' + esc(name) + '</span><span style="font-size:11.5px;color:#5F6368;line-height:1.45">' + esc(need) + '</span></span>';
    h += '<span style="text-align:right;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;padding:2px 6px;border-radius:4px;justify-self:end;' + (good ? 'background:#E3F2E8;color:#1D5E36;' : red ? 'background:#FDE3E3;color:#9B1C1C;' : 'background:#EEEEEA;color:#3F444A;') + '">' + esc(v) + '</span></div>';
  });
  h += '</section></main></div></div>';
  document.getElementById('app').innerHTML = h;
}
render();
</script>
</body>
</html>
