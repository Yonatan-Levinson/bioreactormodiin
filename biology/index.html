<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novella — Biology Experiments Schedule</title>
<style>
  :root{
    --bg:#f6f7f4;--panel:#ffffff;--panel-2:#f0f2ec;--line:#dde2d6;--line-soft:#e9ece3;
    --ink:#283021;--ink-dim:#5d6a54;--ink-faint:#93a087;
    --leaf:#5a9d2f;--leaf-dim:#6fae3f;--leaf-deep:#487f25;--berry:#d8483b;--apricot:#e0852b;--sky:#3a8fcc;--violet:#8a63c4;
    --shadow:0 1px 3px rgba(40,48,33,.10);--shadow-lg:0 12px 32px rgba(40,48,33,.18);
    --radius:8px;--label-w:120px;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;}
  input,select,textarea{font-family:inherit;font-size:13px;}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;row-gap:8px;box-shadow:var(--shadow);z-index:50;}
  .brand{display:flex;align-items:center;gap:8px;margin-right:2px;flex:none;}
  .mark{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--apricot) 0 32%,transparent 33%),radial-gradient(circle at 64% 26%,var(--berry) 0 20%,transparent 21%),linear-gradient(140deg,var(--leaf-deep),var(--leaf-dim));}
  .brand h1{font-size:14px;font-weight:600;letter-spacing:.2px;}
  .brand span{color:var(--ink-faint);font-weight:400;}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .seg button{padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--ink-dim);background:var(--panel);}
  .seg button.on{background:var(--leaf);color:#fff;}
  .seg button+button{border-left:1px solid var(--line);}
  .span-seg{margin-left:2px;}
  .span-seg button{padding:6px 9px;font-size:11.5px;}
  .span-seg.hide{display:none;}
  .nav{display:flex;align-items:center;gap:4px;}
  .nav button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}
  .nav button:hover{border-color:var(--leaf);color:var(--ink);}
  .period{min-width:150px;text-align:center;font-weight:600;font-size:13px;}
  .today-btn{padding:6px 11px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink-dim);}
  .today-btn:hover{border-color:var(--leaf);color:var(--ink);}
  .spacer{flex:1;min-width:0;}
  .navgroup{display:flex;align-items:center;gap:10px;flex:none;}
  .actiongroup{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:nowrap;margin-left:auto;}
  .actiongroup>*{flex:none;}
  .toggle-tasks{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12.5px;color:var(--ink-dim);font-weight:500;}
  .toggle-tasks.on{background:var(--panel-2);color:var(--ink);border-color:var(--ink-faint);}
  .toggle-tasks .sw{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--ink-faint);display:flex;align-items:center;justify-content:center;font-size:10px;}
  .toggle-tasks.on .sw{background:var(--sky);border-color:var(--sky);color:#fff;}
  .tool{padding:7px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);}
  .tool:hover{border-color:var(--leaf);}
  .tool.run{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .tool.run:hover{background:var(--leaf-deep);}
  .tool.tbtn-task{background:var(--sky);border-color:var(--sky);color:#fff;}
  .tool.tbtn-task:hover{filter:brightness(.94);}
  .menu-wrap{position:relative;}
  .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;min-width:230px;z-index:60;box-shadow:var(--shadow-lg);display:none;}
  .menu.open{display:block;}
  .menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:5px;font-size:13px;color:var(--ink);}
  .menu button:hover{background:var(--panel-2);}
  .menu a{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:5px;font-size:13px;color:var(--ink);text-decoration:none;}
  .menu a:hover{background:var(--panel-2);}
  .site-btn{background:var(--violet);border-color:var(--violet);color:#fff;display:flex;align-items:center;gap:5px;}
  .site-btn:hover{filter:brightness(.94);}
  .site-btn .care{font-size:9px;opacity:.85;}
  .hide{display:none!important;}
  .schedule-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .projectsgrid{display:none;flex:1;overflow:auto;padding:18px;align-content:start;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .projectsgrid.show{display:grid;}
  .workplan{display:none;flex-direction:column;min-height:100%;}
  .workplan.show{display:flex;}
  .wp-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);}
  .wp-summary{font-size:13px;color:var(--ink-dim);}
  .wp-summary b{color:var(--ink);}
  .wp-lag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-dim);}
  .wp-lag input{width:56px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--ink);}
  .wp-zoom button{padding:5px 10px;font-size:11.5px;}
  .wp-legendrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-dim);margin-left:auto;}
  .wp-legendrow .lk{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
  .wp-warn .line{padding:5px 14px;background:rgba(216,72,59,.06);border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--berry);font-weight:600;}
  .wp-main{display:flex;align-items:flex-start;overflow-x:auto;flex:1;}
  .wp-left{flex:none;position:sticky;left:0;z-index:8;background:var(--panel);border-right:1px solid var(--line);box-shadow:2px 0 4px rgba(40,48,33,.05);}
  .wp-tr{display:flex;height:36px;border-bottom:1px solid var(--line-soft);}
  .wp-tr.head{height:30px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .wp-tr.head .wp-td{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-dim);padding:0 8px;}
  .wp-tr.conflict{background:rgba(216,72,59,.06);}
  .wp-td{flex:none;border-right:1px solid var(--line-soft);display:flex;align-items:center;min-width:0;}
  .wp-td.num{justify-content:center;font-size:11px;color:var(--ink-faint);}
  .wp-td input,.wp-td select{width:100%;height:100%;border:none;background:transparent;padding:0 8px;font-size:12.5px;color:var(--ink);}
  .wp-td input:focus,.wp-td select:focus{outline:none;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(90,157,47,.25);}
  .wp-td input[type=number]{padding:0 4px 0 8px;}
  .wp-td.ctl{justify-content:center;}
  .wp-ro{padding:0 8px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;display:flex;align-items:center;gap:5px;width:100%;}
  .wp-unpin{border:none;background:none;color:var(--sky);cursor:pointer;font-size:13px;padding:0 2px;}
  .wp-del{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding:0 6px;}
  .wp-del:hover{color:var(--berry);}
  .wp-gantt{flex:none;}
  .wp-ghead{position:relative;height:30px;border-bottom:1px solid var(--line);background:var(--panel-2);}
  .wp-month{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);display:flex;align-items:center;padding-left:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-dim);overflow:hidden;white-space:nowrap;}
  .wp-grows{position:relative;}
  .wp-gline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft);}
  .wp-today{position:absolute;top:0;bottom:0;width:2px;background:rgba(90,157,47,.55);z-index:2;}
  .wp-grow{position:relative;height:36px;border-bottom:1px solid var(--line-soft);}
  .wp-bar{position:absolute;top:7px;height:22px;border-radius:5px;color:#fff;font-size:11.5px;font-weight:600;line-height:20px;padding:0 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08);user-select:none;z-index:3;}
  .wp-bar.dragging{opacity:.85;cursor:grabbing;z-index:10;box-shadow:var(--shadow-lg);}
  .wp-bar.conflict{box-shadow:0 0 0 2px var(--berry);}
  .pcards-empty{grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:13px;max-width:320px;margin:80px auto;}
  .pcards-empty b{color:var(--ink-dim);display:block;margin-bottom:4px;font-size:14px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,border-color .15s;}
  .pcard:hover{box-shadow:var(--shadow-lg);border-color:var(--violet);}
  .pcard-top{display:flex;justify-content:space-between;align-items:center;}
  .pdept{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--violet);background:rgba(138,99,196,.12);padding:3px 9px;border-radius:20px;}
  .pname{font-size:15.5px;font-weight:700;color:var(--ink);}
  .powner,.ptimeline{font-size:12px;color:var(--ink-dim);}
  .pgoals{font-size:12.5px;color:var(--ink-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;}
  .pmeta{font-size:11px;color:var(--ink-faint);margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft);}
  .scrim.scrim-lg{padding:14px;}
  .modal.modal-lg{max-width:1600px;width:calc(100vw - 28px);max-height:calc(100vh - 28px);overflow:auto;resize:both;}
  .exptable{width:auto;table-layout:fixed;border-collapse:collapse;margin-top:6px;background:var(--panel);}
  .exptable th,.exptable td{border:1px solid var(--line);padding:0;vertical-align:top;}
  .exptable th{position:relative;background:var(--panel-2);padding:7px 8px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-dim);white-space:nowrap;text-align:left;overflow:hidden;text-overflow:ellipsis;}
  .exptable input,.exptable .exp-cell{width:100%;border:none;background:transparent;padding:7px 8px;font-size:12.5px;color:var(--ink);}
  .exptable .exp-cell{display:block;min-height:30px;line-height:1.4;font-family:inherit;white-space:pre-wrap;word-break:break-word;}
  .exptable .exp-cell ul,.exptable .exp-cell ol{margin:4px 0;padding-left:18px;}
  .exptable input:focus,.exptable .exp-cell:focus{outline:none;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(90,157,47,.25);}
  .exptable .exp-cell.sel{background:rgba(90,157,47,.18);}
  .rt-toolbar{display:flex;gap:4px;margin:6px 0;}
  .rt-btn{width:28px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink-dim);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .rt-btn:hover{border-color:var(--leaf);color:var(--ink);}
  .col-resize{position:absolute;top:0;right:0;bottom:0;width:6px;cursor:col-resize;}
  .col-resize:hover{background:rgba(90,157,47,.3);}
  .exp-delrow,.col-del{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:13px;padding:4px 8px;line-height:1;flex:none;}
  .exp-delrow:hover,.col-del:hover{color:var(--berry);}
  .exptable td.exp-rowctl{width:28px;text-align:center;border-left:none;}
  .exptable-wrap{overflow-x:auto;}
  .exptable-tools{display:flex;gap:8px;margin-top:8px;}
  .exptable-tools .tool{padding:6px 11px;font-size:12px;}
  .cols-editor{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .col-chip{display:flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:2px;}
  .col-chip input{border:none;background:transparent;font-size:12.5px;width:110px;padding:5px 2px;color:var(--ink);}
  .col-chip input:focus{outline:none;}
  .col-move{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:13px;padding:4px 5px;line-height:1;border-radius:4px;}
  .col-move:hover:not(:disabled){background:var(--panel);color:var(--ink);}
  .col-move:disabled{opacity:.3;cursor:default;}
  .wstream{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--panel-2);}
  .wstream-head{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .wstream-head .ws-title{flex:1;font-weight:700;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);}
  .ws-desc{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--ink-dim);margin-bottom:8px;resize:vertical;}
  .gantt-range{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-bottom:6px;}
  .gantt-group{margin-bottom:10px;}
  .gantt-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin-bottom:4px;}
  .gantt-rows{display:flex;flex-direction:column;gap:5px;}
  .gantt-row{display:flex;align-items:center;gap:8px;}
  .gantt-label{width:150px;flex:none;font-size:12px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gantt-track{position:relative;flex:1;height:18px;background:var(--panel-2);border-radius:4px;}
  .gantt-bar{position:absolute;top:0;bottom:0;border-radius:4px;box-shadow:var(--shadow);min-width:4px;}
  .ptab{display:none;}
  .ptab.show{display:block;}
  .ptab-seg{margin:0 0 16px;}
  .sched-total{font-size:13px;color:var(--ink-dim);margin-bottom:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;}
  .sched-total b{color:var(--ink);font-size:14px;}
  .sched-ro{padding:7px 8px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;}
  .sched-num{padding:7px 8px;font-size:11.5px;color:var(--ink-faint);text-align:center;}
  .sched-warn{color:var(--berry);font-size:12px;margin-top:6px;}
  .sched-warn-inline{color:var(--berry);font-weight:600;}
  .menu .sep{height:1px;background:var(--line-soft);margin:5px 2px;}
  .menu .note{padding:6px 10px;font-size:11px;color:var(--ink-faint);line-height:1.5;}
  .menu .note b{color:var(--ink-dim);}
  .scroll{flex:1;overflow:auto;position:relative;}
  .timeline{position:relative;min-width:max-content;display:none;}
  .timeline.show{display:block;}
  .colhead{position:sticky;top:0;z-index:30;display:flex;background:var(--panel);border-bottom:1px solid var(--line);height:44px;}
  .corner{position:sticky;left:0;z-index:5;width:var(--label-w);min-width:var(--label-w);background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);font-weight:700;}
  .daycell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);font-size:11px;color:var(--ink-dim);gap:1px;padding:4px 0;}
  .daycell .dow{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px;}
  .daycell .dnum{font-size:14px;font-weight:700;color:var(--ink);}
  .daycell.today{background:rgba(90,157,47,.10);}
  .daycell.today .dnum{color:var(--leaf-deep);}
  .daycell{cursor:pointer;}
  .daycell.sel{background:rgba(58,143,204,.14);box-shadow:inset 0 -2px 0 var(--sky);}
  .station{display:flex;border-bottom:1px solid var(--line-soft);}
  .station-label{position:sticky;left:0;z-index:6;width:var(--label-w);min-width:var(--label-w);background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:13px;}
  .station-dot{width:8px;height:8px;border-radius:2px;flex:none;background:var(--leaf);}
  .station-dot.gen{background:var(--sky);border-radius:50%;}
  .general-row{background:rgba(58,143,204,.04);}
  .lane{position:relative;flex:1;}
  .lane .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft);}
  .lane .vline.today{background:rgba(90,157,47,.32);width:2px;}
  .lane .wknd{position:absolute;top:0;bottom:0;background:rgba(40,48,33,.025);}
  .bar{position:absolute;border-radius:6px;padding:0 9px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;cursor:grab;overflow:hidden;white-space:nowrap;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.07);user-select:none;}
  .bar:hover{box-shadow:0 3px 10px rgba(40,48,33,.28);z-index:12;}
  .bar.dragging{opacity:.9;cursor:grabbing;z-index:40;box-shadow:var(--shadow-lg);}
  .bar .ph{opacity:.9;font-weight:500;}
  .bar-title{overflow:hidden;text-overflow:ellipsis;}
  .bar-day{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.22);padding:1px 6px;border-radius:10px;white-space:nowrap;flex:none;}
  .linkmark{font-weight:700;opacity:.85;}
  .linkmark.wk{margin-left:6px;cursor:pointer;flex:none;padding:0 3px;}
  .linkmark.wk:hover{opacity:1;}
  .bar .grip{font-size:10px;opacity:.6;}
  .bar .handle{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;}
  .bar .handle.l{left:0;}.bar .handle.r{right:0;}
  .task{position:absolute;height:21px;border-radius:5px;font-size:11px;font-weight:500;padding:0 7px;display:flex;align-items:center;gap:5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);cursor:grab;white-space:nowrap;overflow:hidden;box-shadow:var(--shadow);}
  .task.done{opacity:.55;text-decoration:line-through;}
  .task .chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--ink-faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;}
  .task.done .chk{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .task .tdot{width:7px;height:7px;border-radius:50%;flex:none;}
  .deps{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:visible;}
  .deps path{fill:none;stroke:var(--ink-faint);stroke-width:1.5;stroke-dasharray:3 3;}
  .deps .arrowhead{fill:var(--ink-faint);stroke:none;}
  .monthgrid{display:none;flex-direction:column;height:100%;min-height:0;padding:10px 12px 12px;}
  .monthgrid.show{display:flex;}
  .month-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .month-dows div{text-align:center;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);padding:2px 0;}
  .weeks{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;justify-content:flex-start;}
  .wkrow{flex:1 1 0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative;min-height:110px;max-height:300px;}
  .cell{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:5px 7px;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .cell.out{background:var(--panel-2);opacity:.6;}
  .cell.today{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf) inset;}
  .cell.wknd{background:rgba(40,48,33,.018);}
  .cell.sel{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky) inset;}
  .cell .cnum{font-size:14px;font-weight:700;color:var(--ink-dim);align-self:center;line-height:22px;}
  .cell.today .cnum{background:var(--leaf);color:#fff;border-radius:50%;width:23px;height:23px;display:flex;align-items:center;justify-content:center;font-size:13px;align-self:center;}
  .cell .cbody{flex:1;}
  .wkbars{position:absolute;inset:0;pointer-events:none;}
  .mbar{position:absolute;height:32px;border-radius:5px;font-size:13.5px;font-weight:600;color:#fff;padding:3px 9px 0;display:flex;align-items:flex-start;gap:4px;overflow:hidden;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.06);}
  .mbar .ph{opacity:.88;font-weight:500;}
  .mbar-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:16px;display:flex;align-items:center;gap:6px;min-width:0;}
  .stchip{flex:none;font-size:11px;font-weight:800;letter-spacing:.3px;background:rgba(0,0,0,.24);color:#fff;padding:1px 7px;border-radius:9px;line-height:1.4;}
  .mbar-ticks{position:absolute;left:0;right:0;bottom:2px;height:12px;pointer-events:none;}
  .mtick{position:absolute;bottom:0;font-size:10.5px;font-weight:700;line-height:1;color:#fff;opacity:.92;letter-spacing:.2px;transform:translateX(-50%);text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.25);}
  .mbar.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;}
  .mbar.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;}
  .mtask{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:var(--ink-dim);padding:2px 5px;border-radius:4px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mtask:hover{background:var(--panel-2);}
  .mtask.done{opacity:.5;text-decoration:line-through;}
  .mtask .md{width:6px;height:6px;border-radius:50%;flex:none;}
  .mtask .mchk{font-size:9px;color:var(--leaf);}
  .mmore{font-size:11px;color:var(--ink-faint);padding:1px 4px;cursor:pointer;text-align:center;}
  .mmore:hover{color:var(--leaf-deep);}
  .empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;color:var(--ink-faint);font-size:13px;max-width:300px;z-index:5;}
  .empty b{color:var(--ink-dim);display:block;margin-bottom:4px;font-size:14px;}
  .footer{display:flex;gap:14px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--ink-dim);flex-wrap:wrap;}
  .footer .item{display:flex;align-items:center;gap:5px;}
  .footer .lk{width:11px;height:11px;border-radius:3px;}
  .save-state{margin-left:auto;color:var(--ink-faint);}
  .scrim{position:fixed;inset:0;background:rgba(40,48,33,.34);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto;backdrop-filter:blur(2px);}
  .scrim.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:440px;padding:20px;box-shadow:var(--shadow-lg);}
  .modal h2{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .modal h2 .x{font-size:22px;color:var(--ink-faint);width:24px;height:24px;line-height:1;}
  .fld{margin-bottom:13px;}
  .fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);margin-bottom:5px;font-weight:700;}
  .fld label .sub{text-transform:none;letter-spacing:0;color:var(--ink-faint);font-weight:400;}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px rgba(90,157,47,.12);}
  .fld.row{display:flex;gap:10px;}.fld.row>div{flex:1;}
  .serlist{display:flex;flex-direction:column;gap:6px;margin-bottom:9px;}
  .serrow{display:flex;align-items:center;gap:8px;}
  .serrow .ser-name{flex:1;min-width:0;}
  .serwk{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);white-space:nowrap;}
  .serwk input{width:54px;}
  .serdate{font-size:12px;color:var(--ink-dim);white-space:nowrap;min-width:52px;text-align:right;}
  .ser-del{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:16px;line-height:1;padding:0 3px;}
  .ser-del:hover{color:var(--berry);}
  .seractions{display:flex;gap:8px;flex-wrap:wrap;}
  .seractions .tool{padding:6px 11px;font-size:12px;}
  /* A series experiment is only touched one day a week, so it is drawn as pips on those days
     joined by a dashed spine -- never a solid bar, which would imply continuous work. */
  .bar.series,.mbar.series{background:transparent!important;border:1.5px dashed var(--sc);color:var(--ink);box-shadow:none;cursor:pointer;}
  .bar.series .bar-day{background:var(--sc);color:#fff;}
  .pips{position:absolute;inset:0;pointer-events:none;}
  .pip{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:var(--sc);border:2px solid var(--panel);}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer;}
  .swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions .tool{flex:1;justify-content:center;text-align:center;padding:9px;}
  .modal-actions .danger{flex:none;color:var(--berry);border-color:transparent;}
  .modal-actions .danger:hover{border-color:var(--berry);}
  .hint{font-size:11px;color:var(--ink-faint);margin-top:5px;line-height:1.45;}
  .toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow-lg);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:720px){
    :root{--label-w:64px;}
    header{gap:7px;padding:8px 10px;}
    .brand span{display:none;}
    .tool .lbl,.toggle-tasks .lbl{display:none;}
    .period{min-width:88px;font-size:12px;}
    .footer .legend-items{display:none;}
    .month-dows div{font-size:9px;}
    .wkrow{min-height:74px;}
    .cell{padding:3px 4px;border-radius:6px;}
    .mbar{font-size:11px;height:26px;padding:2px 5px 0;}
    .stchip{font-size:9px;padding:1px 4px;}
    .mtick{font-size:8px;}
    .cell .cnum{font-size:12px;}
  }
</style>
</head>

<script>
"use strict";
let CLOUD_URL="https://script.google.com/macros/s/AKfycbx7ArqCYVett_7ykHH7gKsFhnysfa-K_tF9oPUA_tJn2gYjr0snVMjTQBVfN9iizngr/exec";
const PROJECTS_CLOUD_URL="https://script.google.com/macros/s/AKfycbyIiFWFH1xRF75XwCEwKRH2DJK1MUdkbt-qQfz93UzzV91KX1LsybQc15lxXIBTTjeqvg/exec";
const PALETTE=[{name:"Leaf",c:"#5a9d2f"},{name:"Berry",c:"#d8483b"},{name:"Apricot",c:"#e0852b"},{name:"Sky",c:"#3a8fcc"},{name:"Violet",c:"#8a63c4"},{name:"Slate",c:"#6c7a82"}];
const DEFAULT_STATIONS=[{id:"exp",name:"Experiments"}];
const KEY="novella_bioreactor_biology_v1",URLKEY="novella_cloud_url_biology";
let state=load()||{stations:structuredClone(DEFAULT_STATIONS),runs:[],tasks:[],projects:[],workplan:{lagDays:7,items:[]}};
if(!state.projects)state.projects=[];
if(!state.workplan||!Array.isArray(state.workplan.items))state.workplan={lagDays:7,items:[]};
let page="schedule",view="month",showTasks=true,anchor=startOfDay(new Date());
let selDate=null; // ISO date the user clicked in the calendar; new runs/tasks start here (null = today)
let monthSpan=2; // 0 = full month; otherwise number of weeks to show. Default: 2-week view.
let monthRolling=false; // when true, full-month shows a rolling 5-week window (set by wheel)
let cloud={on:false,polling:null,lastHash:""};
CLOUD_URL=(localStorage.getItem(URLKEY)||"").trim()||CLOUD_URL;

function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function iso(d){const x=startOfDay(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function parse(s){const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd);}
function dayDiff(a,b){return Math.round((startOfDay(b)-startOfDay(a))/86400000);}
function durOf(r){return dayDiff(parse(r.start),parse(r.end))+1;}
function endFromDuration(start,days){return iso(addDays(parse(start),Math.max(1,days)-1));}
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function weekDays(){const sun=addDays(anchor,-anchor.getDay());return Array.from({length:5},(_,i)=>addDays(sun,i));}
function monthMatrix(){
  if(monthSpan>0){
    // N weeks starting from the Sunday of the week containing the anchor
    const gs=addDays(anchor,-anchor.getDay());
    const rows=[];for(let w=0;w<monthSpan;w++)rows.push(Array.from({length:7},(_,d)=>addDays(gs,w*7+d)));
    return rows;
  }
  if(monthRolling){
    // rolling 5-week window starting at the Sunday of the anchor's week
    const gs=addDays(anchor,-anchor.getDay());
    const rows=[];for(let w=0;w<5;w++)rows.push(Array.from({length:7},(_,d)=>addDays(gs,w*7+d)));
    return rows;
  }
  const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);const gs=addDays(first,-first.getDay());
  const rows=[];for(let w=0;w<6;w++)rows.push(Array.from({length:7},(_,d)=>addDays(gs,w*7+d)));
  while(rows.length>4&&rows[rows.length-1].every(d=>d.getMonth()!==anchor.getMonth()))rows.pop();
  return rows;
}
function periodLabel(){
  if(view==="week"){const d=weekDays(),a=d[0],b=d[4];return `${a.getDate()} ${MON[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MON[b.getMonth()].slice(0,3)}`;}
  if(monthSpan>0||monthRolling){const rows=monthMatrix();const a=rows[0][0],b=rows[rows.length-1][6];
    return `${a.getDate()} ${MON[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MON[b.getMonth()].slice(0,3)}`;}
  return `${MON[anchor.getMonth()]} ${anchor.getFullYear()}`;
}

function dataHash(){return JSON.stringify({s:state.stations,r:state.runs,t:state.tasks});}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
let saveTimer;
function save(push=true){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}flashSaved();if(push&&cloud.on)cloudPush();}
function flashSaved(){const el=document.getElementById("saveState");if(!el)return;el.textContent=cloud.on?"Synced ✓":"Saved on this device ✓";clearTimeout(saveTimer);saveTimer=setTimeout(()=>{el.textContent=cloud.on?"☁ Live — shared with team":"This device only";},1500);}

async function cloudInit(){if(!CLOUD_URL){updateCloudUI();return;}cloud.on=true;updateCloudUI();await cloudPull(true);cloud.polling=setInterval(()=>cloudPull(false),5000);}
async function cloudPull(initial){if(!CLOUD_URL)return;try{const res=await fetch(CLOUD_URL+"?action=get&t="+Date.now());if(!res.ok)throw new Error(res.status);const data=await res.json();if(data&&data.runs){const incoming=JSON.stringify({s:data.stations,r:data.runs,t:data.tasks});if(incoming!==cloud.lastHash&&incoming!==dataHash()){state={stations:(data.stations&&data.stations.length)?data.stations:structuredClone(DEFAULT_STATIONS),runs:data.runs||[],tasks:data.tasks||[],projects:state.projects||[],workplan:state.workplan};localStorage.setItem(KEY,JSON.stringify(state));render();if(!initial)toast("Updated from team");}cloud.lastHash=incoming;}}catch(e){const ss=document.getElementById("saveState");if(ss)ss.textContent="⚠ Sync paused — retrying";}}
let pushTimer;
function cloudPush(){clearTimeout(pushTimer);pushTimer=setTimeout(async()=>{try{const body=JSON.stringify({stations:state.stations,runs:state.runs,tasks:state.tasks});cloud.lastHash=JSON.stringify({s:state.stations,r:state.runs,t:state.tasks});await fetch(CLOUD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});}catch(e){const ss=document.getElementById("saveState");if(ss)ss.textContent="⚠ Couldn't sync — saved locally";}},400);}
function updateCloudUI(){const note=document.getElementById("cloudNote"),btn=document.getElementById("connectCloud");if(cloud.on){note.innerHTML="<b>Cloud sync is ON.</b> Everyone on the shared link sees changes live.";btn.textContent="⛅ Cloud settings…";const ss=document.getElementById("saveState");if(ss)ss.textContent="☁ Live — shared with team";}else{note.innerHTML="<b>Storage:</b> this device only. Connect a Google Sheet to share live.";btn.textContent="⛅ Connect cloud sync…";}}
function scheduleSnapshot(data=state){return {stations:(data.stations&&data.stations.length)?data.stations:structuredClone(DEFAULT_STATIONS),runs:data.runs||[],tasks:data.tasks||[]};}
function scheduleHasContent(data){const s=scheduleSnapshot(data);return s.runs.length>0||s.tasks.length>0||JSON.stringify(s.stations)!==JSON.stringify(DEFAULT_STATIONS);}
async function connectCloudSafely(url){
  const local=scheduleSnapshot();
  const res=await fetch(url+"?action=get&t="+Date.now());
  if(!res.ok)throw new Error("Cloud returned "+res.status);
  const raw=await res.json();
  if(!raw||!Array.isArray(raw.runs))throw new Error("That URL is not a schedule endpoint");
  const remote=scheduleSnapshot(raw);
  const differs=JSON.stringify(local)!==JSON.stringify(remote);
  let uploadLocal=scheduleHasContent(local)&&!scheduleHasContent(remote);
  if(differs&&scheduleHasContent(local)&&scheduleHasContent(remote)){
    uploadLocal=!confirm("This cloud Sheet already contains a different schedule.\n\nOK — use the cloud schedule\nCancel — upload this device's schedule");
  }
  if(uploadLocal){const pushed=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(local)});if(!pushed.ok)throw new Error("Cloud upload failed");}
  CLOUD_URL=url;localStorage.setItem(URLKEY,url);cloud.on=true;cloud.lastHash="";updateCloudUI();await cloudPull(true);cloud.polling=setInterval(()=>cloudPull(false),5000);
}

// Projects AND the work plan are department-wide: one shared copy living in Modi'in's Sheet,
// reached through this channel and never through this site's own CLOUD_URL. Keeping them off
// the schedule channel is what stops an edit made here from clobbering Modi'in's runs/tasks.
let projectsLastHash="";
function sharedHash(p,w){return JSON.stringify({p:p||[],w:w||{lagDays:7,items:[]}});}
// Never swap shared state out from under someone mid-edit: re-rendering rebuilds the work-plan
// inputs (losing focus and caret) and row indexes could shift under an in-flight change. Returning
// early leaves lastHash untouched, so the very next poll applies whatever the team changed.
function editingShared(){const a=document.activeElement;return !!(a&&a.closest&&a.closest("#wpview,.modal"));}
async function projectsInit(){await projectsPull(true);setInterval(()=>projectsPull(false),5000);}
async function projectsPull(initial){
  if(!initial&&editingShared())return;
  try{
    const res=await fetch(PROJECTS_CLOUD_URL+"?action=get&t="+Date.now());
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    const wpIn=(data.workplan&&Array.isArray(data.workplan.items))?data.workplan:{lagDays:7,items:[]};
    const incoming=sharedHash(data.projects,wpIn);
    if(incoming!==projectsLastHash&&incoming!==sharedHash(state.projects,state.workplan)){
      state.projects=data.projects||[];
      state.workplan=wpIn;
      localStorage.setItem(KEY,JSON.stringify(state));
      if(page==="projects"||page==="workplan")render();
      if(!initial)toast("Shared plan updated from team");
    }
    projectsLastHash=incoming;
  }catch(e){}
}
let projectsPushTimer;
function projectsPush(){
  clearTimeout(projectsPushTimer);
  projectsPushTimer=setTimeout(async()=>{
    try{
      const res=await fetch(PROJECTS_CLOUD_URL+"?action=get&t="+Date.now());
      const remote=res.ok?await res.json():{};
      // Read-modify-write: spread remote first, then overwrite ONLY the shared keys, so Modi'in's
      // own stations/runs/tasks (and any key this copy doesn't know about) survive the POST.
      const body=JSON.stringify({...remote,stations:remote.stations||[],runs:remote.runs||[],tasks:remote.tasks||[],projects:state.projects,workplan:state.workplan});
      projectsLastHash=sharedHash(state.projects,state.workplan);
      await fetch(PROJECTS_CLOUD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    }catch(e){}
  },400);
}
function saveProjects(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}flashSaved();projectsPush();}

const mg=document.getElementById("monthgrid");
function renderMonth(){
  const rows=monthMatrix(),todayIso=iso(new Date()),m=anchor.getMonth();
  mg.innerHTML="";
  const dows=document.createElement("div");dows.className="month-dows";
  DOW.forEach(d=>{const x=document.createElement("div");x.textContent=d;dows.appendChild(x);});
  mg.appendChild(dows);
  const weeks=document.createElement("div");weeks.className="weeks";
  rows.forEach(week=>{
    const wk=document.createElement("div");wk.className="wkrow";
    const wStart=week[0],wEnd=week[6];
    week.forEach(d=>{
      const cell=document.createElement("div");
      const out=d.getMonth()!==m,we=d.getDay()===5||d.getDay()===6;
      cell.className="cell"+(out?" out":"")+(iso(d)===todayIso?" today":"")+(we&&!out?" wknd":"")+(iso(d)===selDate?" sel":"");
      cell.innerHTML=`<div class="cnum">${d.getDate()}</div><div class="cbody"></div>`;
      cell.addEventListener("click",()=>pickDate(d));
      cell.addEventListener("dblclick",()=>{openRunModal(null,iso(d));});
      wk.appendChild(cell);
    });
    const overlay=document.createElement("div");overlay.className="wkbars";
    const laneRows=[];
    const runsHere=state.runs.map(r=>({r,s:parse(r.start),e:parse(r.end)})).filter(o=>o.e>=wStart&&o.s<=wEnd).sort((a,b)=>a.s-b.s);
    runsHere.forEach(o=>{
      const segS=o.s<wStart?wStart:o.s,segE=o.e>wEnd?wEnd:o.e;
      const col0=dayDiff(wStart,segS),span=dayDiff(segS,segE)+1;
      let lane=0;while(laneRows[lane]&&laneRows[lane].some(rg=>!(col0+span<=rg[0]||col0>=rg[1])))lane++;
      (laneRows[lane]=laneRows[lane]||[]).push([col0,col0+span]);
      const bar=document.createElement("div");
      bar.className="mbar"+(o.s<wStart?" cont-l":"")+(o.e>wEnd?" cont-r":"");
      const ser=isSeries(o.r);
      if(ser){bar.classList.add("series");bar.style.setProperty("--sc",o.r.color);}
      else bar.style.background=o.r.color;
      bar.style.left=`calc(${col0}/7*100% + 3px)`;
      bar.style.width=`calc(${span}/7*100% - 6px)`;
      bar.style.top=(28+lane*LANE_H())+"px";
      const totalDays=durOf(o.r);

/* ---------- Work plan: department-wide MS-Project-style planner ---------- */
// The work plan is one department-wide plan shared by all five dashboards, and it lives in
// Modi'in's Sheet. On this site copy it therefore rides the shared projects channel, NOT this

function wpDays(t){return Math.max(1,Math.round((parseFloat(t.dur)||1)*7));}

function computeWorkplan(){
  const wpst=state.workplan,items=wpst.items||[];
  const lag=Math.max(0,parseInt(wpst.lagDays)||0);
  const byIdItem={};items.forEach(t=>byIdItem[t.id]=t);
  const validDeps=t=>(t.deps||[]).filter(d=>d!==t.id&&byIdItem[d]);
  const indeg={},dependents={};
  items.forEach(t=>{indeg[t.id]=0;});
  items.forEach(t=>validDeps(t).forEach(d=>{indeg[t.id]++;(dependents[d]=dependents[d]||[]).push(t.id);}));
  const queue=items.filter(t=>indeg[t.id]===0).map(t=>t.id),order=[];
  while(queue.length){const id=queue.shift();order.push(id);(dependents[id]||[]).forEach(n=>{if(--indeg[n]===0)queue.push(n);});}
  const cyclic=new Set(items.filter(t=>!order.includes(t.id)).map(t=>t.id));
  const byId={},baseById={};
  order.forEach(id=>{const t=byIdItem[id];
    const predEnds=validDeps(t).map(d=>byId[d]&&byId[d].end).filter(Boolean);
    let base=null;
    if(predEnds.length){let m=predEnds[0];predEnds.forEach(e=>{if(parse(e)>parse(m))m=e;});base=iso(addDays(parse(m),1+lag));}
    const manual=/^\d{4}-\d{2}-\d{2}$/.test(t.start||"")?t.start:"";
    let start;
    if(base&&manual)start=parse(manual)>parse(base)?manual:base;
    else if(base)start=base;
    else start=manual||iso(startOfDay(new Date()));
    baseById[id]=base;
    byId[id]={start,end:endFromDuration(start,wpDays(t))};
  });
  let span=null;
  order.forEach(id=>{const o=byId[id],s=parse(o.start),e=parse(o.end);if(!span)span={min:s,max:e};else{if(s<span.min)span.min=s;if(e>span.max)span.max=e;}});
  // soft flag: two runs on the same station overlapping in time
  const conflicts=new Set(),msgs=[];
  const byStation={};
  items.forEach(t=>{const st=(t.station||"").trim().toLowerCase();if(!st||!byId[t.id])return;(byStation[st]=byStation[st]||[]).push(t);});
  Object.keys(byStation).forEach(st=>{const arr=byStation[st];
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const a=byId[arr[i].id],b=byId[arr[j].id];
      if(parse(a.start)<=parse(b.end)&&parse(b.start)<=parse(a.end)){
        conflicts.add(arr[i].id);conflicts.add(arr[j].id);
        msgs.push(`${arr[i].station.trim()} double-booked: "${arr[i].name||"untitled"}" overlaps "${arr[j].name||"untitled"}"`);
      }
    }});
  return {byId,baseById,order,span,cyclic,conflicts,msgs};
}

  const minD=new Date(lo.getFullYear(),lo.getMonth(),1);
  let maxD=new Date(hi.getFullYear(),hi.getMonth()+2,0);
  if(dayDiff(minD,maxD)<180)maxD=new Date(minD.getFullYear(),minD.getMonth()+6,0);
  return {minD,maxD};
}
function wpGanttHTML(cs){
  const items=state.workplan.items;
  if(!items.length)return `<div class="hint" style="padding:16px">The timeline appears here as you add experiments.</div>`;
  const {minD,maxD}=wpRangeCalc(cs);
  const ppd=wpZoom/7,W=Math.round((dayDiff(minD,maxD)+1)*ppd);
  let mh="",glines="";
  let m=new Date(minD);
  while(m<=maxD){
    const mEnd=new Date(m.getFullYear(),m.getMonth()+1,0);
    const left=dayDiff(minD,m)*ppd,wpx=(dayDiff(m,mEnd)+1)*ppd;
    mh+=`<div class="wp-month" style="left:${left}px;width:${wpx}px">${MON[m.getMonth()].slice(0,3)} ${String(m.getFullYear()).slice(2)}</div>`;
    glines+=`<div class="wp-gline" style="left:${left}px"></div>`;
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  const today=startOfDay(new Date());
  const todayLine=(today>=minD&&today<=maxD)?`<div class="wp-today" style="left:${dayDiff(minD,today)*ppd}px"></div>`:"";
  const rows=items.map(t=>{
    const o=cs.byId[t.id];
    if(!o||cs.cyclic.has(t.id))return `<div class="wp-grow"></div>`;
    const left=dayDiff(minD,parse(o.start))*ppd,wpx=Math.max(6,wpDays(t)*ppd-2);
    const conflict=cs.conflicts.has(t.id);
    const tip=`${t.name||"Untitled"} · ${fmtShort(o.start)} – ${fmtShort(o.end)} · ${t.dur} wk${t.station?" · "+t.station:""}${conflict?" · ⚠ overlaps another experiment on this station":""}`;
    return `<div class="wp-grow"><div class="wp-bar${conflict?" conflict":""}" data-id="${t.id}" style="left:${left}px;width:${wpx}px;background:${projColor(t.project)}" title="${esc(tip)}">${esc(t.name||"")}</div></div>`;
  }).join("");
  return `<div style="width:${W}px"><div class="wp-ghead">${mh}</div><div class="wp-grows">${glines}${todayLine}${rows}</div></div>`;
}

/* ---------- Weekly series ----------
A flask experiment is not continuous work: Dorin seeds on one weekday, passages on that same
weekday for the next two weeks, then counts on the fourth. `r.series` is that plan --
[{id,name,week}] -- and every step lands on start + 7×week, so all steps share a weekday.
Steps carry a stable `id`, and the tasks they generate carry it back as `seriesStep`. That is
what makes regeneration safe: generated tasks are found and replaced by that field, a step
that survived the edit keeps its done state, and any task without `seriesStep` was created by
hand and is never touched or deleted. */
const SERIES_DEFAULT=[["Seed",0],["Passage",1],["Passage",2],["Count",3]];
function newSeries(){return SERIES_DEFAULT.map(([name,week])=>({id:uid(),name,week}));}
function isSeries(r){return !!(r&&r.series&&r.series.length);}
function seriesStepDate(start,week){return iso(addDays(parse(start),7*(Math.max(0,parseInt(week)||0))));}
function seriesDates(r){return isSeries(r)?r.series.map(s=>seriesStepDate(r.start,s.week)):[];}
function generateSeriesTasks(r){
  const prev={};
  state.tasks.forEach(t=>{if(t.runId===r.id&&t.seriesStep)prev[t.seriesStep]=t;});
  state.tasks=state.tasks.filter(t=>!(t.runId===r.id&&t.seriesStep));
  r.series.forEach(s=>{
    const was=prev[s.id];
    state.tasks.push({id:was?was.id:uid(),station:r.station,
      title:`${s.name||"Step"} — ${r.title||"Untitled experiment"}`,
      date:seriesStepDate(r.start,s.week),color:r.color,
      done:was?!!was.done:false,runId:r.id,seriesStep:s.id});
  });
  return r.series.length;
}
function hasGeneratedTasks(r){return state.tasks.some(t=>t.runId===r.id&&t.seriesStep);}
// Keep already-generated tasks on their experiment's dates after any move (drag, cascade, edit).
// Only experiments that have generated tasks are touched -- this never generates on its own.
function syncSeriesTasks(){state.runs.forEach(r=>{if(isSeries(r)&&hasGeneratedTasks(r))generateSeriesTasks(r);});}

function projectSpan(p){

    if(s)return s;
  }

function computeSchedule(tasks){

  tasks.forEach(t=>{indeg[t.id]=0;});

  const queue=tasks.filter(t=>indeg[t.id]===0).map(t=>t.id),order=[];
  while(queue.length){const id=queue.shift();order.push(id);(dependents[id]||[]).forEach(n=>{if(--indeg[n]===0)queue.push(n);});}

  const byId={};
  order.forEach(id=>{const t=byIdTask[id];

    let start;
    if(predEnds.length){let m=predEnds[0];predEnds.forEach(e=>{if(parse(e)>parse(m))m=e;});start=iso(addDays(parse(m),1));}

    schedWrap.querySelectorAll(".sc-del").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,id=schedule[i].id;schedule.splice(i,1);schedule.forEach(t=>t.deps=(t.deps||[]).filter(d=>d!==id));paintSchedule();});
    const ghost=schedWrap.querySelector(".sc-name-ghost");
    ghost.oninput=()=>{
      schedule.push({id:uid(),name:ghost.value,dur:1,deps:[],start:""});
      paintSchedule();
      const inp=schedWrap.querySelector(`.sc-name[data-i="${schedule.length-1}"]`);
      if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
    };
    paintTotal(cs);
    renderScheduleGantt(schedGantt,schedule);
  }
  paintCols();
  paintWorkstreams();
  paintSchedule();
  activeModalCtx={workstreams,paintWorkstreams};
  modal.querySelector("#ws-add").onclick=()=>{workstreams.push({id:uid(),title:"",description:"",rows:[]});paintWorkstreams();};
  modal.querySelectorAll(".rt-btn").forEach(b=>{
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.onclick=()=>{
      const el=document.activeElement;
      if(!el||!el.classList||!el.classList.contains("exp-cell"))return;
      document.execCommand(b.dataset.cmd,false,null);
      workstreams[+el.dataset.wi].rows[+el.dataset.ri].cells[+el.dataset.ci]=el.innerHTML;
    };
  });
  modal.querySelector("#mx").onclick=closeModal;modal.querySelector("#p-cancel").onclick=closeModal;modal.querySelector("#p-name").focus();
  if(!isNew)modal.querySelector("#p-del").onclick=()=>{if(!confirm("Delete this project?"))return;state.projects=state.projects.filter(x=>x.id!==p.id);saveProjects();render();closeModal();toast("Project deleted");};
  modal.querySelector("#p-save").onclick=()=>{
    const obj={...p,
      name:modal.querySelector("#p-name").value.trim()||"Untitled project",
      owner:modal.querySelector("#p-owner").value.trim(),
      dept:modal.querySelector("#p-dept").value,
      goals:modal.querySelector("#p-goals").value.trim(),
      plan:modal.querySelector("#p-plan").value.trim(),
      expCols:[...expCols],
      expColWidths:[...expColWidths],
      workstreams:workstreams.map(w=>({id:w.id,title:w.title.trim(),description:w.description.trim(),rows:w.rows.map(r=>({cells:r.cells.map(c=>sanitizeRT(c||"")),start:r.start,end:r.end}))})),
      schedule:{tasks:schedule.filter(t=>t.name.trim()||(t.deps||[]).length||t.start||t.dur>1).map(t=>({id:t.id,name:t.name.trim(),dur:Math.max(1,parseInt(t.dur)||1),deps:(t.deps||[]).filter(d=>d!==t.id&&schedule.some(x=>x.id===d)),start:(t.deps&&t.deps.length)?"":(t.start||"")}))},
      milestones:modal.querySelector("#p-milestones").value.split("\n").map(s=>s.trim()).filter(Boolean)
    };
    delete obj.experiments;delete obj.start;delete obj.end;delete obj.expTable;
    if(isNew){state.projects.push(obj);}else{const target=state.projects.find(x=>x.id===p.id);Object.assign(target,obj);delete target.experiments;delete target.start;delete target.end;delete target.expTable;}
    saveProjects();render();closeModal();toast(isNew?"Project added":"Saved");
  };
}

  scrim.classList.add("open");
  modal.querySelector("#mx").onclick=closeModal;
  modal.querySelector("#cl-guide").onclick=()=>toast("Setup guide came with the dashboard (README)");

}

let activeModalCtx=null,cellSel=null,cellDragStart=null;
function paintSelection(){
  document.querySelectorAll(".exptable .exp-cell.sel").forEach(el=>el.classList.remove("sel"));
  if(!cellSel)return;
  const r0=Math.min(cellSel.r0,cellSel.r1),r1=Math.max(cellSel.r0,cellSel.r1);
  const c0=Math.min(cellSel.c0,cellSel.c1),c1=Math.max(cellSel.c0,cellSel.c1);
  document.querySelectorAll(`.exp-cell[data-wi="${cellSel.wi}"]`).forEach(el=>{
    const ri=+el.dataset.ri,ci=+el.dataset.ci;
    if(ri>=r0&&ri<=r1&&ci>=c0&&ci<=c1)el.classList.add("sel");
  });
}
document.addEventListener("mousedown",e=>{
  const cell=e.target.closest(".exp-cell");
  if(cellSel){cellSel=null;paintSelection();}
  cellDragStart=cell?{wi:+cell.dataset.wi,ri:+cell.dataset.ri,ci:+cell.dataset.ci}:null;
});
document.addEventListener("mouseover",e=>{
  if(!cellDragStart||e.buttons!==1)return;
  const cell=e.target.closest(".exp-cell");
  if(!cell||+cell.dataset.wi!==cellDragStart.wi)return;
  const ri=+cell.dataset.ri,ci=+cell.dataset.ci;
  if(ri===cellDragStart.ri&&ci===cellDragStart.ci){if(cellSel){cellSel=null;paintSelection();}return;}
  cellSel={wi:cellDragStart.wi,r0:cellDragStart.ri,c0:cellDragStart.ci,r1:ri,c1:ci};
  window.getSelection().removeAllRanges();
  paintSelection();
});
document.addEventListener("mouseup",()=>{cellDragStart=null;});
document.addEventListener("copy",e=>{
  if(!activeModalCtx||!cellSel||(cellSel.r0===cellSel.r1&&cellSel.c0===cellSel.c1))return;
  const w=activeModalCtx.workstreams[cellSel.wi];
  if(!w)return;
  e.preventDefault();
  const r0=Math.min(cellSel.r0,cellSel.r1),r1=Math.max(cellSel.r0,cellSel.r1);
  const c0=Math.min(cellSel.c0,cellSel.c1),c1=Math.max(cellSel.c0,cellSel.c1);
  const rows=[];
  for(let ri=r0;ri<=r1;ri++){
    const row=w.rows[ri];if(!row)continue;
    const vals=[];
    for(let ci=c0;ci<=c1;ci++)vals.push(htmlToText(row.cells[ci]||""));
    rows.push(vals.join("\t"));
  }
  e.clipboardData.setData("text/plain",rows.join("\n"));
});
document.addEventListener("paste",e=>{
  const cell=e.target.closest&&e.target.closest(".exp-cell");
  if(!cell)return;
  const text=(e.clipboardData||window.clipboardData).getData("text/plain");
  const grid=text.replace(/\r/g,"").split("\n").map(line=>line.split("\t"));
  if(grid.length>1&&grid[grid.length-1].length===1&&grid[grid.length-1][0]==="")grid.pop();
  if(!activeModalCtx||(grid.length===1&&grid[0].length===1)){
    e.preventDefault();
    document.execCommand("insertText",false,text);
    return;
  }
  e.preventDefault();
  const wi=+cell.dataset.wi,ri0=+cell.dataset.ri,ci0=+cell.dataset.ci;
  const w=activeModalCtx.workstreams[wi];
  if(!w){document.execCommand("insertText",false,text);return;}
  grid.forEach((rowVals,dr)=>{
    const row=w.rows[ri0+dr];if(!row)return;
    rowVals.forEach((val,dc)=>{
      const ci=ci0+dc;if(ci>=row.cells.length)return;
      row.cells[ci]=esc(val);
    });
  });
  activeModalCtx.paintWorkstreams();
});

function uid(){return "x"+Math.random().toString(36).slice(2,9);}
function stationName(id){const s=state.stations.find(x=>x.id===id);return s?s.name:"";}
function LANE_H(){return window.innerWidth<=720?30:35;}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const RT_ALLOWED={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,BR:1,DIV:1};
const RT_TAG_RE=/<\/?(b|strong|i|em|u|ul|ol|li|br|div)(\s[^>]*)?>/i;
function sanitizeRT(html){
  const d=document.createElement("div");d.innerHTML=html||"";
  (function clean(node){
    [...node.childNodes].forEach(ch=>{
      if(ch.nodeType===1){
        clean(ch);
        if(RT_ALLOWED[ch.tagName]){[...ch.attributes].forEach(a=>ch.removeAttribute(a.name));}
        else{while(ch.firstChild)ch.parentNode.insertBefore(ch.firstChild,ch);ch.parentNode.removeChild(ch);}
      }else if(ch.nodeType!==3){ch.parentNode.removeChild(ch);}
    });
  })(d);
  return d.innerHTML;
}
function normalizeCell(v){v=v||"";return RT_TAG_RE.test(v)?sanitizeRT(v):esc(v);}
function htmlToText(html){const d=document.createElement("div");d.innerHTML=html||"";return (d.textContent||"").replace(/\s+/g," ").trim();}
let toastTimer;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);}
window.addEventListener("resize",()=>render());
scrollEl.addEventListener("scroll",()=>{if(view==="week")drawDeps();});

// Mouse-wheel time navigation: one week per notch (both views; month keeps its span)
let wheelLock=false, wheelAccum=0;
function wheelStep(dir){ // dir +1 = forward in time (scroll down), -1 = back (scroll up)
  if(view==="month"&&monthSpan===0)monthRolling=true; // full month rolls weekly once you scroll
  anchor=addDays(anchor,7*dir);
  render();
}
scrollEl.addEventListener("wheel",e=>{
  if(page!=="schedule")return; // work plan / projects scroll normally
  // only hijack vertical wheel; let trackpad horizontal pass
  if(Math.abs(e.deltaY)<Math.abs(e.deltaX))return;
  // if the content actually overflows vertically, let the user scroll it normally
  if(scrollEl.scrollHeight>scrollEl.clientHeight+4)return;
  e.preventDefault();
  wheelAccum+=e.deltaY;
  if(wheelLock)return;
  const THRESH=24; // require a real notch before stepping
  if(Math.abs(wheelAccum)>=THRESH){
    wheelStep(wheelAccum>0?1:-1);
    wheelAccum=0;
    wheelLock=true;
    setTimeout(()=>{wheelLock=false;},140); // debounce so one spin = one week
  }
},{passive:false});
